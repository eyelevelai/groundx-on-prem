name: terraform

on:
    push:
        branches: ["**"]
    pull_request:
    release:
        types: [published, created]
    workflow_dispatch:

jobs:
    eks-cluster-version-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: "1.16.3"

            - name: Generate env.tfvars from the example
              run: cp -n terraform/aws/env.tfvars.example terraform/aws/env.tfvars

            - name: Terraform init
              run: terraform -chdir=terraform/aws/eks init -backend=false

            - name: Terraform test
              run: terraform -chdir=terraform/aws/eks test

            - name: Confirm cluster_version is wired to environment_internal.eks_version
              run: |
                  python3 -c "
                  import re, sys

                  text = open('terraform/aws/eks/eks.tf').read()
                  text = re.sub(r'/\*.*?\*/', '', text, flags=re.DOTALL)
                  lines = [l for l in text.splitlines() if not re.match(r'^\s*(#|//)', l)]
                  text = '\n'.join(lines)

                  # Scope the check to the actual module '{ ... }' block in parsed configuration,
                  # not the whole file — a match anywhere in the file (e.g. an unused local
                  # coincidentally carrying the same assignment) is not proof the module argument
                  # itself is wired.
                  match = re.search(r'module\s+\"eyelevel_eks\"\s*{', text)
                  if not match:
                      sys.exit(1)

                  depth = 0
                  end = None
                  in_string = False
                  i = match.end() - 1
                  while i < len(text):
                      c = text[i]
                      if c == '\"':
                          in_string = not in_string
                      elif not in_string:
                          if c == '{':
                              depth += 1
                          elif c == '}':
                              depth -= 1
                              if depth == 0:
                                  end = i
                                  break
                      i += 1
                  if end is None:
                      sys.exit(1)

                  module_block = text[match.end() - 1:end + 1]
                  sys.exit(0 if re.search(r'cluster_version\s*=\s*var\.environment_internal\.eks_version', module_block) else 1)
                  "

            - name: Run resolve-eks-version bash tests
              run: bash bin/tests/resolve-eks-version-test

            - name: Run setup-eks wiring bash tests
              run: bash bin/tests/setup-eks-wiring-test

