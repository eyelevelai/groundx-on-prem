name: dns-observability

on:
  push:
    paths:
      - .github/workflows/dns-observability.yml
      - src/groundx/**
      - helm/**
      - terraform/aws/**
  pull_request:
    paths:
      - .github/workflows/dns-observability.yml
      - src/groundx/**
      - helm/**
      - terraform/aws/**

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Validate Terraform
        run: |
          touch terraform/aws/env.tfvars
          terraform -chdir=terraform/aws/eks init -backend=false -input=false
          terraform -chdir=terraform/aws/eks validate
          terraform -chdir=terraform/aws/eks test -filter=tests/node_diagnostics.tftest.hcl
      - name: Validate probe
        run: |
          python3 -m unittest discover -s src/groundx/tests -p 'test_dns_probe.py' -v
          helm lint src/groundx --set extract.enabled=true --set extract.agent.enabled=true --set extract.agent.dnsProbe.enabled=true
          helm template groundx src/groundx -n eyelevel --set extract.enabled=true --set extract.agent.enabled=true --set extract.agent.dnsProbe.enabled=true >/dev/null
