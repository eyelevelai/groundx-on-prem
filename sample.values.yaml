# Starter for new full installations. Replace placeholders and example hosts.
# Existing installations should retain their own values file when upgrading.
licenseKey: "<groundx-license-key>"

admin:
  apiKey: "<generate-a-uuid-v4>"
  username: "<generate-a-different-uuid-v4>"
  email: "<administrator-email>"

# Authentication defaults to API keys, without password login.
# For local password login or Cognito, see docs/on-prem-identity.md.

cluster:
  type: eks # Set to your Kubernetes platform, such as eks, aks or openshift.
  pvClass: "<existing-storage-class>"
  pvAccessMode: ReadWriteMany # Use ReadWriteOnce for block/local storage.

# Match the separately provisioned MySQL application and migration credentials.
db:
  username: "<database-application-user>"
  password: "<database-application-password>"
  privilegedUsername: "<database-migration-user>"
  privilegedPassword: "<database-migration-password>"

# Backing services must be installed first. For external S3, MySQL or search,
# see README.md, Installing Services, before changing the connection settings.
file:
  bucketName: "<object-store-bucket>"
  customDomain: files.example.com # Must match fileAccess.publicUrl's host.

fileAccess:
  enabled: true
  publicUrl: https://files.example.com
  storageEndpoint: https://store.internal.example.com:9443
  signingEndpoint: https://s3.example.com
  # Existing Secret containing GROUNDX_ACCESS_KEY_ID and GROUNDX_SECRET_ACCESS_KEY.
  # Native AWS S3 may omit this Secret when all storage readers use ambient IAM.
  storageCredentialsSecretName: groundx-storage-credentials
  # Set each assertion true only after completing its verification.
  # See docs/agents/private-file-access.md for backend acceptance and TLS checks.
  originsPrivate: false
  frontProxyTLSVerified: false
  ingress:
    enabled: true
    ingressClassName: nginx # Set to your controller's ingress class.
  tlsSecretName: groundx-files-tls # Existing certificate Secret for publicUrl.
  # Required while the chart deploys OpenSearch: a Secret whose ca.crt holds the public root CAs,
  # the CA that signed the OpenSearch node certificate and any private storage CA.
  # See docs/upgrades.md#installing-opensearch.
  caSecretName: groundx-ca-bundle

# Match the separately provisioned OpenSearch application and admin passwords.
search:
  password: "<search-application-password>"
  privilegedPassword: "<search-administrator-password>"
