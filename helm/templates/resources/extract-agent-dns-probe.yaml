{{- if and .Values.extract.enabled .Values.extract.agent.enabled .Values.extract.agent.dnsProbe.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: extract-agent-dns-probe
  namespace: {{ include "groundx.ns" . | quote }}
data:
  dns_probe.py: |
{{ .Files.Get "files/dns_probe.py" | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: groundx-extract-dns-probe
  namespace: kube-system
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: groundx-extract-dns-probe
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: {{ include "groundx.extract.agent.serviceAccountName" . }}
    namespace: {{ include "groundx.ns" . | quote }}
roleRef:
  kind: Role
  name: groundx-extract-dns-probe
  apiGroup: rbac.authorization.k8s.io
{{- end }}
