suite: layout OCR timeout renders into the layout config.py
set:
  search.password: test-app-credential
  search.privilegedPassword: test-admin-credential
tests:
  - it: "unset renders the 120 second default"
    templates:
      - ../templates/resources/layout-config-py.yaml
    asserts:
      - matchRegex: { path: 'stringData["config.py"]', pattern: "ocrTimeout=120," }

  - it: "an override renders the configured value"
    templates:
      - ../templates/resources/layout-config-py.yaml
    set:
      layout.ocr.timeout: 187
    asserts:
      - matchRegex: { path: 'stringData["config.py"]', pattern: "ocrTimeout=187," }
