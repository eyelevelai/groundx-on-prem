suite: search credentials are operator supplied
tests:
  - it: "fails the render naming search.password when it is empty and search is in use"
    templates:
      - ../templates/resources/config-yaml.yaml
    set:
      search.password: ""
      search.privilegedPassword: test-admin-credential
    asserts:
      - failedTemplate:
          errorPattern: 'search\.password'

  - it: "fails the render naming search.privilegedPassword when it is empty and search is in use"
    templates:
      - ../templates/resources/config-yaml.yaml
    set:
      search.password: test-app-credential
      search.privilegedPassword: ""
      search.existing.url: https://search.test.invalid:9200
    asserts:
      - failedTemplate:
          errorPattern: 'search\.privilegedPassword'

  - it: "renders no search password in ingest mode even when one is supplied"
    templates:
      - ../templates/resources/config-yaml.yaml
    set:
      mode: ingest
      search.password: ingest-sentinel-app-credential
      search.privilegedPassword: ingest-sentinel-admin-credential
    asserts:
      - notMatchRegex:
          path: stringData["config.yaml"]
          pattern: 'ingest-sentinel'
