suite: layout-process render-disk emptyDir, mount, env, and resources
tests:
  - it: "default: the emptyDir volume, mount, env, and resources request render at the 2048Mi budget default"
    templates:
      - ../templates/app/celery.yaml
    documentSelector:
      path: metadata.name
      value: layout-process
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TMPDIR
            value: "/tmp/render"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAYOUT_RENDER_DISK_BUDGET_MIB
            value: "2048"
      - contains:
          path: spec.template.spec.volumes
          content:
            name: render-temp
            emptyDir:
              sizeLimit: 3072Mi
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: render-temp
            mountPath: /tmp/render
      - equal:
          path: spec.template.spec.containers[0].resources.requests["ephemeral-storage"]
          value: 3072Mi

  - it: "override: renderDiskBudgetMi: 4096 renders 5120Mi in sizeLimit and the ephemeral-storage request at 1 worker x 1 thread"
    templates:
      - ../templates/app/celery.yaml
    set:
      layout.process.renderDiskBudgetMi: 4096
    documentSelector:
      path: metadata.name
      value: layout-process
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: render-temp
            emptyDir:
              sizeLimit: 5120Mi
      - equal:
          path: spec.template.spec.containers[0].resources.requests["ephemeral-storage"]
          value: 5120Mi
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAYOUT_RENDER_DISK_BUDGET_MIB
            value: "4096"

  - it: "an ephemeral-storage limit below the computed request is rejected before any resource renders"
    templates:
      - ../templates/resources/layout-supervisord-conf.yaml
    set:
      layout.process.resources.limits.ephemeral-storage: 1Gi
    asserts:
      - failedTemplate:
          errorPattern: 'layout\.process\.resources\.limits\["ephemeral-storage"\].*1Gi.*below the computed ephemeral-storage request of 3072Mi.*renderDiskBudgetMi'

  - it: "negative workers is rejected before any resource renders"
    templates:
      - ../templates/resources/layout-supervisord-conf.yaml
    set:
      layout.process.workers: -1
    asserts:
      - failedTemplate:
          errorPattern: "layout\\.process\\.workers must be at least 1 \\(got -1\\)"

  - it: "negative threads is rejected before any resource renders"
    templates:
      - ../templates/resources/layout-supervisord-conf.yaml
    set:
      layout.process.threads: -1
    asserts:
      - failedTemplate:
          errorPattern: "layout\\.process\\.threads must be at least 1 \\(got -1\\)"

  - it: "an ephemeral-storage limit accepts a decimal SI suffix (k)"
    templates:
      - ../templates/app/celery.yaml
    set:
      layout.process.resources.limits.ephemeral-storage: 4000000k
    documentSelector:
      path: metadata.name
      value: layout-process
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits["ephemeral-storage"]
          value: 4000000k
      - equal:
          path: spec.template.spec.containers[0].resources.requests["ephemeral-storage"]
          value: 3072Mi

  - it: "an ephemeral-storage limit accepts a binary suffix (Pi)"
    templates:
      - ../templates/app/celery.yaml
    set:
      layout.process.resources.limits.ephemeral-storage: 1Pi
    documentSelector:
      path: metadata.name
      value: layout-process
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits["ephemeral-storage"]
          value: 1Pi
      - equal:
          path: spec.template.spec.containers[0].resources.requests["ephemeral-storage"]
          value: 3072Mi

  - it: "an ephemeral-storage limit accepts exponent form"
    templates:
      - ../templates/app/celery.yaml
    set:
      layout.process.resources.limits.ephemeral-storage: "4e9"
    documentSelector:
      path: metadata.name
      value: layout-process
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits["ephemeral-storage"]
          value: "4e9"
      - equal:
          path: spec.template.spec.containers[0].resources.requests["ephemeral-storage"]
          value: 3072Mi

  - it: "an unquoted numeric ephemeral-storage limit from a values file is accepted"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ./files/values.render-disk-unquoted-storage.yaml
    documentSelector:
      path: metadata.name
      value: layout-process
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits["ephemeral-storage"]
          value: 4294967296
      - equal:
          path: spec.template.spec.containers[0].resources.requests["ephemeral-storage"]
          value: 3072Mi

  - it: "an uppercase K suffix is rejected"
    templates:
      - ../templates/resources/layout-supervisord-conf.yaml
    set:
      layout.process.resources.limits.ephemeral-storage: 5000000K
    asserts:
      - failedTemplate:
          errorPattern: '"5000000K" is not a recognized Kubernetes storage quantity'

  - it: "a garbage ephemeral-storage quantity is rejected"
    templates:
      - ../templates/resources/layout-supervisord-conf.yaml
    set:
      layout.process.resources.limits.ephemeral-storage: abc
    asserts:
      - failedTemplate:
          errorPattern: '"abc" is not a recognized Kubernetes storage quantity'
