suite: drain protection renders on the published chart
tests:
  - it: "a worker budget and spread render"
    templates:
      - ../templates/app/metrics.yaml
    set:
      metrics.enabled: true
      metrics.disruptionBudget.enabled: true
      metrics.topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
    asserts:
      - documentSelector: { path: kind, value: PodDisruptionBudget }
        equal: { path: spec.selector.matchLabels.app, value: metrics }
      - documentSelector: { path: kind, value: PodDisruptionBudget }
        equal: { path: spec.unhealthyPodEvictionPolicy, value: AlwaysAllow }
      - documentSelector: { path: kind, value: Deployment }
        equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1

  - it: "notes warn when a budget is on and the minimum replica count is below 2"
    templates:
      - ../templates/NOTES.txt
      - ../templates/_helpers/*.tpl
      - ../templates/_helpers/*/*.tpl
    set:
      metrics.enabled: true
      metrics.disruptionBudget.enabled: true
    asserts:
      - template: ../templates/NOTES.txt
        matchRegex: { path: raw, pattern: "WARNING: metrics has a disruption budget .* replica count \\(replicas.desired\\) is 1" }
