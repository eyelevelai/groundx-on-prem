suite: layout gracePeriod is accepted and rendered by the helm chart surface
tests:
  - it: "gracePeriod on a layout worker and on layout-inference renders on their Deployments"
    templates:
      - ../templates/app/celery.yaml
      - ../templates/app/inference.yaml
    set:
      layout.map.replicas.gracePeriod: 120
      layout.inference.replicas.gracePeriod: 150
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 120
        documentSelector:
          path: metadata.name
          value: layout-map
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 150
        documentSelector:
          path: metadata.name
          value: layout-inference
