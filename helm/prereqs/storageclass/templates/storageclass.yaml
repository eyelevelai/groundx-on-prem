apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
{{- if .Values.isDefaultClass }}
  annotations:
    "storageclass.kubernetes.io/is-default-class": "true"
{{- end }}
  name: {{ .Values.storageClassName }}
volumeBindingMode: WaitForFirstConsumer
provisioner: {{ .Values.provisioner }}
{{- with .Values.reclaimPolicy }}
reclaimPolicy: {{ . }}
{{- end }}
{{- $existing := lookup "storage.k8s.io/v1" "StorageClass" "" .Values.storageClassName }}
{{- $ebsOnlyKeys := list "type" "encrypted" "kmsKeyId" }}
{{- if and $existing $existing.parameters }}
parameters:
{{- range $key, $value := $existing.parameters }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- else }}
{{- with .Values.parameters }}
parameters:
{{- range $key, $value := . }}
{{- if and $value (ne (toString $value) "") (ne (toString $value) "false") (or (not (has $key $ebsOnlyKeys)) (eq $.Values.provisioner "ebs.csi.aws.com")) }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
