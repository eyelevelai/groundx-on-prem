node: eyelevel-cpu-only
serviceName: stream

cluster:
  # version/metaVersion: leave unset so Strimzi picks its own supported defaults;
  # set both to pin an explicit Kafka version/metadata version.
  metaVersion: ""
  port: 9092
  # replicas drives the Kafka broker replication-factor config block and must not
  # exceed nodepool.replicas (the actual broker/controller pool size).
  replicas: 1
  version: ""

nodepool:
  replicas: 1
  storage: 5Gi