operator:
  runtimeClass: nvidia-container-runtime

dcgmExporter:
  enabled: false

daemonsets:
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: eyelevel_node
      operator: Exists
      effect: NoSchedule

node-feature-discovery:
  worker:
    tolerations:
      - key: node-role.kubernetes.io/master
        operator: Equal
        value: ""
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Equal
        value: ""
        effect: NoSchedule
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: eyelevel_node
        operator: Exists
        effect: NoSchedule
