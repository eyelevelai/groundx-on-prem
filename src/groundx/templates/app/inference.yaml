{{- $svcs := (include "groundx.inference.services" . | fromYaml) -}}
{{- $csym := include "groundx.createSymlink" . -}}
{{- $username := include "groundx.container.username" . -}}

{{- range $idx, $entry := $svcs }}
{{- $svcKey := printf "groundx.%s.settings" $entry -}}
{{- $svcData := include $svcKey $ | fromYaml -}}

{{- $aff := get $svcData "affinity" -}}
{{- $anns := get $svcData "annotations" -}}
{{- $bn := get $svcData "baseName" -}}
{{- $cfg := get $svcData "cfg" -}}
{{- $cport := get $svcData "port" | default "0" -}}
{{- $cache := get $svcData "cache" | default dict -}}
{{- $cacheAddr := coalesce (get $cache "addr") (include "groundx.cache.addr" $) -}}
{{- $cachePort := coalesce (get $cache "port") (include "groundx.cache.port" $) -}}
{{- $csct := get $svcData "containerSecurityContext" -}}
{{- $eopts := get $svcData "execOpts" | default "" -}}
{{- $fs := get $svcData "fileSync" | default false -}}
{{- $ms := get $svcData "metrics" | default false -}}
{{- $image := get $svcData "image" -}}
{{- $initCmd := get $svcData "initCommand" | default "" -}}
{{- $ips := include "groundx.imagePullSecrets" $ | fromYaml -}}
{{- $ic := get $svcData "celery" | default "false" -}}
{{- $lbls := get $svcData "labels" -}}
{{- $mapPrefix := get $svcData "mapPrefix" -}}
{{- $mpr := get $svcData "modelParts" -}}
{{- $mv := get $svcData "modelVersion" -}}
{{- $svc := get $svcData "name" -}}
{{- $node := get $svcData "node" -}}
{{- $nsl := get $svcData "nodeSelector" -}}
{{- $pull := get $svcData "pull" -}}
{{- $pvc := get $svcData "pvc" | default dict -}}
{{- $rp := get $svcData "replicas" -}}
{{- $rs := get $svcData "resources" -}}
{{- $rt := get $svcData "runtimeClassName" -}}
{{- $san := get $svcData "serviceAccountName" -}}
{{- $scr := include "groundx.fileAccess.workloadSecrets" (dict "root" $ "service" $entry) | fromYaml | default dict -}}
{{- $sct := get $svcData "securityContext" -}}
{{- $supe := get $svcData "supervisord" -}}
{{- $tl := get $svcData "tolerations" -}}
{{- $tsc := get $svcData "topologySpreadConstraints" -}}
{{- $pdb := get $svcData "disruptionBudget" | default dict -}}
{{- $ud := get $svcData "updateStrategy" -}}
{{- $wd := get $svcData "workingDir" -}}

{{- $desired := get $rp "desired" -}}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc }}
  namespace: {{ include "groundx.ns" $ | quote }}
  labels:
{{ include "groundx.renderDefaultLabels" (dict "name" $svc "indent" 4 "root" $) }}
spec:
  replicas: {{ $desired }}
{{- if and $ud (ne $ud "") }}
  strategy:
    type: {{ $ud }}
{{- end }}
  selector:
    matchLabels:
      app: {{ $svc }}
  template:
    metadata:
      labels:
        app: {{ $svc }}
{{- if gt (len $lbls) 0 }}
{{ toYaml $lbls | nindent 8 }}
{{- end }}
      annotations:
        config-hash: {{ include (print $.Template.BasePath "/resources/" $mapPrefix "-config-py.yaml") $ | sha256sum }}
        config-models-hash: {{ include (print $.Template.BasePath "/resources/config-models.yaml") $ | sha256sum }}
        supervisord-hash: {{ include (print $.Template.BasePath "/resources/" $mapPrefix "-supervisord-conf.yaml") $ | sha256sum }}
{{- if eq $csym "true" }}
        ldconfig-symlink-hash: {{ include (print $.Template.BasePath "/resources/ldconfig-symlink.yaml") $ | sha256sum }}
{{- end }}
{{- if gt (len $anns) 0 }}
{{ toYaml $anns | nindent 8 }}
{{- end }}
    spec:
      terminationGracePeriodSeconds: {{ dig "gracePeriod" (get $svcData "defaultGracePeriod" | default 900) $rp }}
{{- if $rt }}
      runtimeClassName: {{ $rt }}
{{- end }}
{{- if $san }}
      serviceAccountName: {{ $san }}
{{- end }}
{{- if gt (len $ips) 0 }}
      imagePullSecrets:
{{- range $j, $inm := $ips }}
        - name: {{ $inm }}
{{- end }}
{{- end }}
{{- include "groundx.renderAffinity" (dict "ctx" $aff "node" $node "indent" 6 "root" $) }}
{{ include "groundx.renderSecurityContext" (dict "ctx" $sct "indent" 6 "root" $ "user" $username "cfg" "spec") }}
{{- include "groundx.renderNodeSelector" (dict "ctx" $nsl "node" $node "indent" 6 "root" $) }}
{{- include "groundx.renderTolerations" (dict "ctx" $tl "node" $node "indent" 6 "root" $) }}
{{- include "groundx.renderTopologySpread" (dict "ctx" $tsc "indent" 6) }}
      initContainers:
        - name: wait-for-cache
          image: {{ include "groundx.busybox.image" $ }}
          imagePullPolicy: {{ include "groundx.busybox.pull" $ | quote }}
          command: ['sh', '-c', "until nc -z {{ printf "%s %v" $cacheAddr $cachePort }}; do echo waiting for cache; sleep 2; done"]
{{- if $fs }}
        - name: wait-for-file-storage
          image: {{ include "groundx.busybox.image" $ }}
          imagePullPolicy: {{ include "groundx.busybox.pull" $ | quote }}
          command: ['sh', '-c', "until nc -z {{ printf "%s %v" (include "groundx.file.serviceDependency" $) (include "groundx.file.port" $) }}; do echo waiting for file storage; sleep 2; done"]
{{- end }}
{{- if $ms }}
        - name: wait-for-metrics
          image: {{ include "groundx.busybox.image" $ }}
          imagePullPolicy: {{ include "groundx.busybox.pull" $ | quote }}
          command: ['sh', '-c', "until wget -T 5 -qO- {{ include "groundx.metrics.serviceUrl" $ }}/health; do echo waiting for metrics; sleep 2; done"]
{{- end }}
{{- if eq $csym "true" }}
        - name: create-symlink
          image: {{ include "groundx.busybox.image" $ }}
          imagePullPolicy: {{ include "groundx.busybox.pull" $ | quote }}
          command: ["/bin/sh", "-c", "--"]
          args: ["echo 'Running ldconfig_symlink.sh on this node'; /scripts/ldconfig_symlink.sh"]
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          volumeMounts:
            - name: {{ $svc }}
              mountPath: /scripts/ldconfig_symlink.sh
              subPath: ldconfig_symlink.sh
            - name: host-sbin
              mountPath: /host-sbin
            - name: host-usr-sbin
              mountPath: /host-usr-sbin
            - name: host-bin
              mountPath: /host-bin
            - name: host-usr-bin
              mountPath: /host-usr-bin
{{- end }}
{{- if not (empty $pvc) }}
        - name: download-model
          image: {{ include "groundx.busybox.image" $ }}
          imagePullPolicy: {{ include "groundx.busybox.pull" $ | quote }}
          command:
            - /bin/sh
            - -c
            - |
              dir={{ $wd }}/hf_models_cache
              lock="$dir/download.lock"
              marker="$dir/complete.{{ $mv }}"
              wait_limit=3600

              if [ -f "$marker" ]; then
                echo "Model cache already exists. Skipping download."
                echo "Model load done."
                exit 0
              fi

              if ! command -v flock >/dev/null 2>&1; then
                echo "flock is not available in this busybox image; the model download lock needs it. Use a busybox image that provides flock." >&2
                exit 1
              fi

              errf=$(mktemp "$dir/.flock-err.XXXXXX") || { echo "Cannot create a scratch file in $dir; the model volume must be writable." >&2; exit 1; }
              trap 'rm -f "$errf"' EXIT
              exec 9>>"$lock" || { echo "Cannot open $lock for writing; the model volume must support file locks." >&2; exit 1; }

              start=$(date +%s)
              announced=0
              while :; do
                flock -n 9 2>"$errf" && break
                rc=$?
                if [ "$rc" -ne 1 ] || [ -s "$errf" ]; then
                  echo "flock failed on $lock (exit $rc): $(cat "$errf")" >&2
                  exit 1
                fi
                if [ $(( $(date +%s) - start )) -ge "$wait_limit" ]; then
                  echo "Timed out after ${wait_limit}s waiting for another pod to finish downloading the model." >&2
                  exit 1
                fi
                if [ "$announced" -eq 0 ]; then
                  echo "Download in progress by another pod. Waiting..."
                  announced=1
                fi
                sleep 3
              done

              if [ -f "$marker" ]; then
                echo "Model cache ready."
                echo "Model load done."
                exit 0
              fi

              echo "Model downloading started..."
              rm -f "$dir/downloading" "$dir"/{{ $bn }}.tar.*

              echo "{{ $mpr }}" | tr ' ' '\n' | xargs -n 1 -P 5 -I {} sh -c \
                'MAX_RETRIES=3; RETRIES=0; SUCCESS=0; PART={}; URL=https://upload.groundx.ai/{{ $bn }}/model/current/{{ $mv }}.tar.gz.part.$PART; \
                while [ $RETRIES -lt $MAX_RETRIES ]; do \
                  echo "Download [attempt $RETRIES] {{ $bn }}.tar.gz.part.$PART"; \
                  wget -q -O {{ $wd }}/hf_models_cache/{{ $bn }}.tar.gz.part.$PART $URL && { echo "Downloaded {{ $bn }}.tar.gz.part.$PART successfully."; SUCCESS=1; break; }; \
                  echo "Failed to download $URL. Retrying..."; RETRIES=$((RETRIES + 1)); sleep 3; \
                done; \
                [ $SUCCESS -eq 0 ] && { echo "Failed to download $URL after $MAX_RETRIES attempts. Exiting."; exit 1; }; exit 0;'
              xrc=$?
              if [ "$xrc" -ne 0 ]; then
                echo "Model download failed (xargs exit $xrc). No completion marker written." >&2
                exit 1
              fi

              for part in {{ $mpr }}; do
                echo "Unzipping {{ $bn }}.tar.gz.part.$part..."
                tar -xzf {{ $wd }}/hf_models_cache/{{ $bn }}.tar.gz.part.$part -C {{ $wd }}/hf_models_cache/ || { echo "Failed to unzip {{ $bn }}.tar.gz.part.$part. No completion marker written." >&2; exit 1; }
                echo "Unzipping {{ $bn }}.tar.gz.part.$part complete..."
              done

              rm -f "$dir"/{{ $bn }}.tar.* || { echo "Failed to remove downloaded archives." >&2; exit 1; }
              touch "$marker" || { echo "Failed to write $marker." >&2; exit 1; }

              echo "Model load done."
{{ include "groundx.renderSecurityContext" (dict "ctx" $csct "indent" 10 "root" $ "user" $username "cfg" "container") }}
          volumeMounts:
            - name: model-volume
              mountPath: {{ $wd }}/hf_models_cache
{{- end }}
{{- if ne $initCmd "" }}
        - name: init-layout
          image: {{ $image | quote }}
          imagePullPolicy: {{ $pull | quote }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
{{- with include "groundx.fileAccess.caEnv" $ }}
{{ . | nindent 12 }}
{{- end }}
{{- if gt (len $scr) 0 }}
          envFrom:
{{- range $kk, $vv := $scr }}
            - secretRef:
                name: {{ $vv }}
{{- end }}
{{- end }}
          workingDir: {{ $wd }}
          command:
            - /bin/sh
            - -c
            - |
              export PYTHONPATH={{ $wd }}:$PYTHONPATH && exec {{ $initCmd | replace "/app" $wd }}
{{ include "groundx.renderSecurityContext" (dict "ctx" $csct "indent" 10 "root" $ "user" $username "cfg" "container") }}
{{ include "groundx.renderContainerResources" (dict "ctx" $rs "indent" 10) }}
          volumeMounts:
{{- with include "groundx.fileAccess.caMount" $ }}
{{ . | nindent 12 }}
{{- end }}
            - name: config-models
              mountPath: {{ $wd }}/config_models.py
              subPath: config_models.py
            - name: config-volume
              mountPath: {{ $wd }}/config.py
              subPath: config.py
{{- if not (empty $pvc) }}
            - name: model-volume
              mountPath: {{ $wd }}/hf_models_cache
{{- end }}
{{- end }}
      containers:
        - name: {{ $svc | quote }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ $pull | quote }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
{{- with include "groundx.fileAccess.caEnv" $ }}
{{ . | nindent 12 }}
{{- end }}
{{- if eq $mapPrefix "summary" }}
            - name: HF_HUB_OFFLINE
              value: "1"
{{- end }}
{{- if gt (len $scr) 0 }}
          envFrom:
{{- range $kk, $vv := $scr }}
            - secretRef:
                name: {{ $vv }}
{{- end }}
{{- end }}
          workingDir: {{ $wd }}
          command:
            - /bin/sh
            - -c
            - |
              export PYTHONPATH={{ $wd }}:$PYTHONPATH && {{ $eopts }} supervisord -c {{ $wd }}/supervisord.conf
{{ include "groundx.renderSecurityContext" (dict "ctx" $csct "indent" 10 "root" $ "user" $username "cfg" "container") }}
{{- if ne $ic "false" }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - ps aux | grep '{{ $ic }}' | grep -v grep || exit 1
            initialDelaySeconds: 60
            failureThreshold: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - ps aux | grep '{{ $ic }}' | grep -v grep || exit 1
            initialDelaySeconds: 60
            periodSeconds: 30
{{- else }}
          ports:
            - containerPort: {{ $cport }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /alive
              port: {{ $cport }}
            initialDelaySeconds: 30
            failureThreshold: 8
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $cport }}
            initialDelaySeconds: 30
            failureThreshold: 30
            periodSeconds: 15
{{- end }}
{{ include "groundx.renderContainerResources" (dict "ctx" $rs "indent" 10) }}
          volumeMounts:
{{- with include "groundx.fileAccess.caMount" $ }}
{{ . | nindent 12 }}
{{- end }}
            - name: config-models
              mountPath: {{ $wd }}/config_models.py
              subPath: config_models.py
            - name: config-volume
              mountPath: {{ $wd }}/config.py
              subPath: config.py
            - name: supervisord-volume
              mountPath: {{ $wd }}/supervisord.conf
              subPath: supervisord.conf
{{- if not (empty $pvc) }}
            - name: model-volume
              mountPath: {{ $wd }}/hf_models_cache
{{- end }}
      volumes:
{{- with include "groundx.fileAccess.caVolume" $ }}
{{ . | nindent 8 }}
{{- end }}
        - name: config-models
          configMap:
            name: config-models-map
        - name: config-volume
          secret:
            secretName: {{ $cfg }}
        - name: supervisord-volume
          configMap:
            name: {{ $supe }}
{{- if eq $csym "true" }}
        - name: {{ $svc }}
          configMap:
            name: ldconfig-symlink-map
            defaultMode: 0555
        - name: host-sbin
          hostPath:
            path: /sbin
            type: Directory
        - name: host-usr-sbin
          hostPath:
            path: /usr/sbin
            type: Directory
        - name: host-bin
          hostPath:
            path: /bin
            type: Directory
        - name: host-usr-bin
          hostPath:
            path: /usr/bin
            type: Directory
{{- end }}
{{- if not (empty $pvc) }}
        - name: model-volume
          persistentVolumeClaim:
            claimName: {{ dig "name" "" $pvc }}
{{ include "groundx.renderPVC" (dict "ctx" $pvc "app" $svc "root" $) }}
{{- end }}

{{- if dig "enabled" false $pdb }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $svc }}
  namespace: {{ include "groundx.ns" $ | quote }}
  labels:
{{ include "groundx.renderDefaultLabels" (dict "name" $svc "indent" 4 "root" $) }}
spec:
  minAvailable: 1
{{- if semverCompare ">=1.26-0" $.Capabilities.KubeVersion.Version }}
  unhealthyPodEvictionPolicy: AlwaysAllow
{{- end }}
  selector:
    matchLabels:
      app: {{ $svc }}
{{- end }}

{{ end }}
