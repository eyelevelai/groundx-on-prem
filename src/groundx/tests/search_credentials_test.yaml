suite: "search credentials may be empty but never a published default"
chart:
  appVersion: 0.1.0
  version: 0.1.0

tests:
  - it: renders without error and omits the application password when search.password is empty
    templates:
      - ../templates/resources/config-yaml.yaml
    set:
      search.password: ""
      search.privilegedPassword: fixture-admin-credential
    asserts:
      - isKind:
          of: Secret
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'username: "eyelevel"\n\s+extract:'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'password: "fixture-admin-credential"'
  - it: renders without error and omits the admin password when search.privilegedPassword is empty
    templates:
      - ../templates/resources/config-yaml.yaml
    set:
      search.password: fixture-app-credential
      search.privilegedPassword: ""
    asserts:
      - isKind:
          of: Secret
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'password: "fixture-app-credential"'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'search:\n\s+searchModel: all_access'
  - it: renders without error and carries no search password when both are empty
    templates:
      - ../templates/resources/config-yaml.yaml
    set:
      search.password: ""
      search.privilegedPassword: ""
    asserts:
      - isKind:
          of: Secret
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'username: "eyelevel"\n\s+extract:'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'search:\n\s+searchModel: all_access'
  - it: renders without error when search.existing.url is set and both passwords are empty
    templates:
      - ../templates/resources/config-yaml.yaml
    set:
      search.password: ""
      search.privilegedPassword: ""
      search.existing.url: https://search.test.invalid:9200
    asserts:
      - isKind:
          of: Secret
  - it: fails the render when search.password is a banned published default
    templates:
      - ../templates/resources/config-yaml.yaml
    set:
      search.password: gx75-banned-test-app
      search.privilegedPassword: fixture-admin-credential
      search.bannedPasswordHashes:
        - "0b64baf8a25a35bff9695f7d793059d59a7e1763d39674b7eb78943e82f12f2d"
    asserts:
      - failedTemplate:
          errorPattern: 'search\.password must not be a published default'
  - it: fails the render when search.privilegedPassword is a banned published default
    templates:
      - ../templates/resources/config-yaml.yaml
    set:
      search.password: fixture-app-credential
      search.privilegedPassword: gx75-banned-test-admin
      search.bannedPasswordHashes:
        - "525e507e2d1dbdfbfb75717fab944a72d424dd999439f9dfc1422a9d6fafb9e4"
    asserts:
      - failedTemplate:
          errorPattern: 'search\.privilegedPassword must not be a published default'
  - it: fails the render on a banned search.password even when search.privilegedPassword is empty
    templates:
      - ../templates/resources/config-yaml.yaml
    set:
      search.password: gx75-banned-test-app
      search.privilegedPassword: ""
      search.bannedPasswordHashes:
        - "0b64baf8a25a35bff9695f7d793059d59a7e1763d39674b7eb78943e82f12f2d"
    asserts:
      - failedTemplate:
          errorPattern: 'search\.password must not be a published default'
  - it: fails the render on a banned search.privilegedPassword even when search.password is empty
    templates:
      - ../templates/resources/config-yaml.yaml
    set:
      search.password: ""
      search.privilegedPassword: gx75-banned-test-admin
      search.bannedPasswordHashes:
        - "525e507e2d1dbdfbfb75717fab944a72d424dd999439f9dfc1422a9d6fafb9e4"
    asserts:
      - failedTemplate:
          errorPattern: 'search\.privilegedPassword must not be a published default'
  - it: fails the render on a banned search.password when every Golang service is disabled outside ingest mode
    templates:
      - ../templates/resources/config-yaml.yaml
    set:
      groundx.enabled: false
      layoutWebhook.enabled: false
      preProcess.enabled: false
      process.enabled: false
      queue.enabled: false
      largeFileDeliver.enabled: false
      summaryClient.enabled: false
      upload.enabled: false
      search.password: gx75-banned-test-app
      search.privilegedPassword: fixture-admin-credential
      search.bannedPasswordHashes:
        - "0b64baf8a25a35bff9695f7d793059d59a7e1763d39674b7eb78943e82f12f2d"
    asserts:
      - failedTemplate:
          errorPattern: 'search\.password must not be a published default'
  - it: renders in ingest mode without search passwords
    templates:
      - ../templates/resources/config-yaml.yaml
    set:
      mode: ingest
      search.password: ""
      search.privilegedPassword: ""
    asserts:
      - isKind:
          of: Secret
  - it: renders no search password in ingest mode even when one is supplied
    templates:
      - ../templates/resources/config-yaml.yaml
    set:
      mode: ingest
      search.password: fixture-app-credential
      search.privilegedPassword: fixture-admin-credential
    asserts:
      - notMatchRegex:
          path: stringData["config.yaml"]
          pattern: 'fixture-(app|admin)-credential'
  - it: injects the cluster credentials Secret into the groundx Deployment only when cluster.secrets lists it
    templates:
      - ../templates/app/golang.yaml
    set:
      cluster.secrets: [eyelevel-secret-credentials]
      search.password: ""
      search.privilegedPassword: ""
    documentSelector:
      path: spec.template.metadata.labels.app
      value: groundx
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: eyelevel-secret-credentials
  - it: omits the cluster credentials Secret from the groundx Deployment when cluster.secrets is unset
    templates:
      - ../templates/app/golang.yaml
    set:
      search.password: ""
      search.privilegedPassword: ""
    documentSelector:
      path: spec.template.metadata.labels.app
      value: groundx
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom
