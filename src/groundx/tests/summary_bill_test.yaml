suite: summary bill delivery
chart:
  appVersion: 0.1.0
  version: 0.1.0
tests:
  - it: creates the enabled worker with bounded concurrency and mounted credentials
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.summary-bill.yaml
    documentSelector:
      path: metadata.name
      value: summary-bill-delivery
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: test.invalid/summary-bill-delivery:local
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: summary-bill-credential-0
            mountPath: /var/run/groundx/summary-bill/operations-drive
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: summary-bill-credential-0
            secret:
              secretName: summary-bill-drive
              items:
                - key: service-account.json
                  path: credentials.json
  - it: emits the same delivery topic and credential path for Go workers
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.summary-bill.yaml
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'fileSummaryBill:\n\s+broker:.*\n\s+groupId: file-summary-bill\n\s+topic: file-summary-bill\n\s+type: kafka'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'credentialsFile: /var/run/groundx/summary-bill/operations-drive/credentials.json'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'summaryBillDeliveryServer:'
  - it: omits optional delivery configuration when explicitly disabled
    templates:
      - ../templates/resources/config-yaml.yaml
    set:
      summaryBillDeliver.enabled: false
    asserts:
      - notMatchRegex:
          path: stringData["config.yaml"]
          pattern: 'summaryBill|file-summary-bill'
  - it: creates a Kafka delivery topic with the requested worker partition count
    templates:
      - ../templates/services/stream-topics.yaml
    values:
      - ./files/values.summary-bill.yaml
    set:
      summaryBillDeliver.replicas.desired: 3
    documentSelector:
      path: metadata.name
      value: file-summary-bill
    asserts:
      - isKind:
          of: KafkaTopic
      - equal:
          path: spec.partitions
          value: 3
  - it: uses the external SQS queue
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.summary-bill.yaml
    set:
      stream.topics.summaryBill.type: sqs
      stream.topics.summaryBill.url: https://sqs.us-west-2.amazonaws.com/123456789012/summary-bill
      stream.topics.summaryBill.region: us-west-2
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'fileSummaryBill:\n\s+region: us-west-2\n\s+type: sqs\n\s+url: https://sqs.us-west-2.amazonaws.com/123456789012/summary-bill'
  - it: creates no additional Kafka topic for SQS delivery
    templates:
      - ../templates/services/stream-topics.yaml
    values:
      - ./files/values.summary-bill.yaml
    set:
      stream.topics.summaryBill.type: sqs
      stream.topics.summaryBill.url: https://sqs.us-west-2.amazonaws.com/123456789012/summary-bill
    asserts:
      - hasDocuments:
          count: 5
  - it: mounts no Drive credentials in the producer
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.summary-bill.yaml
    documentSelector:
      path: metadata.name
      value: queue
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 1
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1
