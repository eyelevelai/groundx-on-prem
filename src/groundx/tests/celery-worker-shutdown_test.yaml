suite: "celery worker shutdown group renders as expected"
chart:
  appVersion: 0.1.0
  version: 0.1.0

set:
  search:
    password: fixture-app-credential
    privilegedPassword: fixture-admin-credential

tests:
  - it: "extract-agent with one worker renders a one-program group (finalize success)"
    templates:
      - ../templates/resources/extract-supervisord-conf.yaml
    values:
      - ../values/extract/values.yaml
    documentSelector:
      path: metadata.name
      value: extract-agent-supervisord-conf-map
    asserts:
      - matchRegex:
          path: data["supervisord.conf"]
          pattern: "\\[group:celery_workers\\]\\n\\s*programs=celery_worker_1\\n"
  - it: "extract-agent with three workers groups all of them (finalize success; catches a group listing only the first)"
    templates:
      - ../templates/resources/extract-supervisord-conf.yaml
    values:
      - ../values/extract/values.yaml
    set:
      extract.agent.workers: 3
    documentSelector:
      path: metadata.name
      value: extract-agent-supervisord-conf-map
    asserts:
      - matchRegex:
          path: data["supervisord.conf"]
          pattern: "\\[group:celery_workers\\]\\n\\s*programs=celery_worker_1,celery_worker_2,celery_worker_3\\n"
  - it: "extract-download with two workers groups both of them (finalize success)"
    templates:
      - ../templates/resources/extract-supervisord-conf.yaml
    values:
      - ../values/extract/values.yaml
    set:
      extract.download.workers: 2
    documentSelector:
      path: metadata.name
      value: extract-download-supervisord-conf-map
    asserts:
      - matchRegex:
          path: data["supervisord.conf"]
          pattern: "\\[group:celery_workers\\]\\n\\s*programs=celery_worker_1,celery_worker_2\\n"
  - it: "extract-save with two workers groups both of them (finalize success)"
    templates:
      - ../templates/resources/extract-supervisord-conf.yaml
    values:
      - ../values/extract/values.yaml
    set:
      extract.save.workers: 2
    documentSelector:
      path: metadata.name
      value: extract-save-supervisord-conf-map
    asserts:
      - matchRegex:
          path: data["supervisord.conf"]
          pattern: "\\[group:celery_workers\\]\\n\\s*programs=celery_worker_1,celery_worker_2\\n"
  - it: "extract workers keep stopwaitsecs of grace minus 30 inside the group (skip unrelated repair path; must not block)"
    templates:
      - ../templates/resources/extract-supervisord-conf.yaml
    values:
      - ../values/extract/values.yaml
    set:
      extract.agent.workers: 2
      extract.agent.replicas.gracePeriod: 120
    documentSelector:
      path: metadata.name
      value: extract-agent-supervisord-conf-map
    asserts:
      - matchRegex:
          path: data["supervisord.conf"]
          pattern: "stopwaitsecs=90\\n(.|\\n)*stopwaitsecs=90\\n(.|\\n)*\\[group:celery_workers\\]"
