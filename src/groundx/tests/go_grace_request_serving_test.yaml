suite: "layoutWebhook and metrics share the Go shutdown rule"
chart:
  appVersion: 0.1.0
  version: 0.1.0

set:
  search:
    password: fixture-app-credential
    privilegedPassword: fixture-admin-credential
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
    useExisting: true

tests:
  - it: "layout-webhook pod and block render 150 and 120 by default"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values/minikube/values.yaml
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 150
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: layout-webhook
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "layoutWebhookServer:\n  baseURL: .*\n  drainSeconds: 120\n  port: "
        template: ../templates/resources/config-yaml.yaml
  - it: "layoutWebhook.replicas.gracePeriod changes layout-webhook only"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      layoutWebhook.replicas.gracePeriod: 60
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: layout-webhook
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 150
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: groundx
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "layoutWebhookServer:\n  baseURL: .*\n  drainSeconds: 30\n"
        template: ../templates/resources/config-yaml.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "groundxServer:\n  baseURL: .*\n  drainSeconds: 120\n"
        template: ../templates/resources/config-yaml.yaml
  - it: "metrics pod and block render 150 and 120 by default"
    templates:
      - ../templates/app/metrics.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values/minikube/values.yaml
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 150
        template: ../templates/app/metrics.yaml
        documentSelector:
          path: kind
          value: Deployment
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "metricsServer:\n  baseURL: .*\n  drainSeconds: 120\n  port: "
        template: ../templates/resources/config-yaml.yaml
  - it: "metrics.replicas.gracePeriod changes metrics only"
    templates:
      - ../templates/app/metrics.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      metrics.replicas.desired: 1
      metrics.replicas.gracePeriod: 90
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 90
        template: ../templates/app/metrics.yaml
        documentSelector:
          path: kind
          value: Deployment
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "metricsServer:\n  baseURL: .*\n  drainSeconds: 60\n"
        template: ../templates/resources/config-yaml.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "groundxServer:\n  baseURL: .*\n  drainSeconds: 120\n"
        template: ../templates/resources/config-yaml.yaml
  - it: "layoutWebhook gracePeriod of zero is rejected before anything renders"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      layoutWebhook.replicas.gracePeriod: 0
    asserts:
      - failedTemplate:
          errorPattern: "layoutWebhook/replicas/gracePeriod.*minimum: got 0, want 1"
  - it: "metrics gracePeriod of zero is rejected before anything renders"
    templates:
      - ../templates/app/metrics.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      metrics.replicas.desired: 1
      metrics.replicas.gracePeriod: 0
    asserts:
      - failedTemplate:
          errorPattern: "metrics/replicas/gracePeriod.*minimum: got 0, want 1"
  - it: "a bare metrics.replicas.gracePeriod renders without setting desired"
    templates:
      - ../templates/app/metrics.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      metrics.replicas.gracePeriod: 90
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 90
        template: ../templates/app/metrics.yaml
        documentSelector:
          path: kind
          value: Deployment
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "metricsServer:\n  baseURL: .*\n  drainSeconds: 60\n"
        template: ../templates/resources/config-yaml.yaml
