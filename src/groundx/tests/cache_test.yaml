suite: "caches render as expected"
chart:
  appVersion: 0.1.0
  version: 0.1.0

tests:
  - it: "default: cache"
    templates:
      - ../templates/services/cache.yaml
      - ../templates/services/cache-metrics.yaml
    values:
      - ../values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "empty: cache"
    templates:
      - ../templates/services/cache.yaml
      - ../templates/services/cache-metrics.yaml
    values:
      - ./files/values.empty.yaml
    asserts:
      - matchSnapshot: {}
  - it: "aws: cache"
    templates:
      - ../templates/services/cache.yaml
      - ../templates/services/cache-metrics.yaml
    values:
      - ../values/values.aws.services.yaml
    asserts:
      - matchSnapshot: {}
  - it: "openshift: cache"
    templates:
      - ../templates/services/cache.yaml
      - ../templates/services/cache-metrics.yaml
    values:
      - ../values/openshift/values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "minikube: cache"
    templates:
      - ../templates/services/cache.yaml
      - ../templates/services/cache-metrics.yaml
    values:
      - ../values/minikube/values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "existing: cache"
    templates:
      - ../templates/services/cache.yaml
      - ../templates/services/cache-metrics.yaml
    values:
      - ../values/values.existing.yaml
    asserts:
      - matchSnapshot: {}
  - it: "metadata: cache"
    templates:
      - ../templates/services/cache.yaml
      - ../templates/services/cache-metrics.yaml
    values:
      - ./files/values.metadata.yaml
    asserts:
      - matchSnapshot: {}
  - it: "disabled: cache"
    templates:
      - ../templates/services/cache.yaml
      - ../templates/services/cache-metrics.yaml
    values:
      - ./files/values.disabled.yaml
    asserts:
      - matchSnapshot: {}
  - it: "extract: cache"
    templates:
      - ../templates/services/cache.yaml
      - ../templates/services/cache-metrics.yaml
    values:
      - ../values/extract/values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "extract.ingest: cache"
    templates:
      - ../templates/services/cache.yaml
      - ../templates/services/cache-metrics.yaml
    values:
      - ./files/values.extract.ingest.yaml
    asserts:
      - matchSnapshot: {}
  - it: "extract.oai: cache"
    templates:
      - ../templates/services/cache.yaml
      - ../templates/services/cache-metrics.yaml
    values:
      - ../values/extract/values.oai.yaml
    asserts:
      - matchSnapshot: {}
  - it: "cloud: cache"
    templates:
      - ../templates/services/cache.yaml
      - ../templates/services/cache-metrics.yaml
    values:
      - ./files/values.cloud.yaml
    asserts:
      - matchSnapshot: {}
  - it: "phoenix: cache"
    templates:
      - ../templates/services/cache.yaml
      - ../templates/services/cache-metrics.yaml
    values:
      - ./files/values.phoenix.yaml
    asserts:
      - matchSnapshot: {}
  - it: "workspace-enabled: cache"
    templates:
      - ../templates/services/cache.yaml
      - ../templates/services/cache-metrics.yaml
    values:
      - ./files/values.disabled.yaml
      - ./files/values.workspace.enabled.yaml
    asserts:
      - matchSnapshot: {}
  - it: "cache-persistence: cache"
    templates:
      - ../templates/services/cache.yaml
      - ../templates/services/cache-metrics.yaml
    values:
      - ./files/values.cache.persistence.yaml
    asserts:
      - matchSnapshot: {}
  - it: "chart-created main cache (password-only) gets a requirepass conf Secret mounted and started with it"
    templates:
      - ../templates/resources/cache-conf.yaml
      - ../templates/services/cache.yaml
    values:
      - ../values.yaml
    set:
      cache.password: "main-conf-p@ss"
    asserts:
      - hasDocuments:
          count: 1
        template: ../templates/resources/cache-conf.yaml
      - equal:
          path: metadata.name
          value: cache-conf-map
        template: ../templates/resources/cache-conf.yaml
      - matchRegex:
          path: stringData["redis.conf"]
          pattern: 'include /etc/redis\.conf'
        template: ../templates/resources/cache-conf.yaml
      - matchRegex:
          path: stringData["redis.conf"]
          pattern: 'requirepass "main-conf-p@ss"'
        template: ../templates/resources/cache-conf.yaml
      - notMatchRegex:
          path: stringData["redis.conf"]
          pattern: 'requirepass main-conf-p@ss'
        template: ../templates/resources/cache-conf.yaml
      - notMatchRegex:
          path: stringData["redis.conf"]
          pattern: "user default off"
        template: ../templates/resources/cache-conf.yaml
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - redis-server
            - /etc/redis/redis.conf
        template: ../templates/services/cache.yaml
        documentSelector:
          path: kind
          value: StatefulSet
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: cache-conf
            mountPath: /etc/redis
            readOnly: true
        template: ../templates/services/cache.yaml
        documentSelector:
          path: kind
          value: StatefulSet
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cache-conf
            secret:
              secretName: cache-conf-map
        template: ../templates/services/cache.yaml
        documentSelector:
          path: kind
          value: StatefulSet
      - isNotNullOrEmpty:
          path: spec.template.metadata.annotations["config-hash"]
        template: ../templates/services/cache.yaml
        documentSelector:
          path: kind
          value: StatefulSet
  - it: "default-off: with no credential, chart-created main cache renders no conf Secret, no conf mount/args, no config-hash annotation"
    templates:
      - ../templates/resources/cache-conf.yaml
      - ../templates/services/cache.yaml
    values:
      - ../values.yaml
    asserts:
      - hasDocuments:
          count: 0
        template: ../templates/resources/cache-conf.yaml
      - notExists:
          path: spec.template.spec.containers[0].args
        template: ../templates/services/cache.yaml
        documentSelector:
          path: kind
          value: StatefulSet
      - notExists:
          path: spec.template.metadata.annotations
        template: ../templates/services/cache.yaml
        documentSelector:
          path: kind
          value: StatefulSet
  - it: "a space-containing chart-created cache password renders a quoted requirepass so redis-server does not treat the words as extra arguments"
    templates:
      - ../templates/resources/cache-conf.yaml
    values:
      - ../values.yaml
    set:
      cache.password: "pw with space"
    asserts:
      - matchRegex:
          path: stringData["redis.conf"]
          pattern: 'requirepass "pw with space"'
        template: ../templates/resources/cache-conf.yaml
      - notMatchRegex:
          path: stringData["redis.conf"]
          pattern: 'requirepass pw with space'
        template: ../templates/resources/cache-conf.yaml
  - it: "a chart-created cache password containing a double-quote and backslash is escaped so it cannot terminate the quoted requirepass string early"
    templates:
      - ../templates/resources/cache-conf.yaml
    values:
      - ../values.yaml
    set:
      cache.password: 'a"b\c'
    asserts:
      - matchRegex:
          path: stringData["redis.conf"]
          pattern: 'requirepass "a\\"b\\\\c"'
        template: ../templates/resources/cache-conf.yaml
      - notMatchRegex:
          path: stringData["redis.conf"]
          pattern: 'requirepass "a"'
        template: ../templates/resources/cache-conf.yaml
  - it: "a chart-created cache ACL username containing a double-quote is quoted and escaped so it cannot unbalance the redis.conf user line"
    templates:
      - ../templates/resources/cache-conf.yaml
    values:
      - ../values.yaml
    set:
      cache.username: 'ac"l'
      cache.password: "pw"
    asserts:
      - matchRegex:
          path: stringData["redis.conf"]
          pattern: 'user "ac\\"l" on ">pw" ~\* &\* \+@all'
        template: ../templates/resources/cache-conf.yaml
      - notMatchRegex:
          path: stringData["redis.conf"]
          pattern: 'user ac"l on'
        template: ../templates/resources/cache-conf.yaml
  - it: "a chart-created cache password containing a newline is escaped to a backslash-n so it cannot inject a second redis.conf directive"
    templates:
      - ../templates/resources/cache-conf.yaml
    values:
      - ../values.yaml
    set:
      cache.password: "line1\nline2"
    asserts:
      - matchRegex:
          path: stringData["redis.conf"]
          pattern: 'requirepass "line1\\nline2"'
        template: ../templates/resources/cache-conf.yaml
  - it: "a whitespace ACL username is rejected by the schema before it can produce an invalid redis.conf"
    templates:
      - ../templates/resources/cache-conf.yaml
    values:
      - ../values.yaml
    set:
      cache.username: "alice bob"
      cache.password: "pw"
    asserts:
      - failedTemplate:
          errorPattern: "cache/username.*does not match pattern"
        template: ../templates/resources/cache-conf.yaml
