suite: "GX-24: main cache identity renders AUTH credentials"
chart:
  appVersion: 0.1.0
  version: 0.1.0

tests:
  - it: "schema accepts cache.password / cache.username (top-level) alongside an external cache"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.enabled: false
      cache.existing.addr: cache.existing.com
      cache.password: r3dispass
      cache.username: reduser
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'username: "reduser"'

  - it: "schema accepts cache.existing.password / cache.existing.username"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.enabled: false
      cache.existing.addr: cache.existing.com
      cache.existing.password: r3dispass
      cache.existing.username: reduser
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'username: "reduser"'

  - it: "cache.existing.password takes precedence over top-level cache.password"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.enabled: false
      cache.existing.addr: cache.existing.com
      cache.password: toplevelpass
      cache.existing.password: existingpass
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'password: "existingpass"'
      - notMatchRegex:
          path: stringData["config.yaml"]
          pattern: "toplevelpass"

  - it: "cashbot-go rec.session block renders the raw, unencoded password and username"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.enabled: false
      cache.existing.addr: cache.existing.com
      cache.password: "p@ss:word/1#"
      cache.username: reduser
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'rec:\n  mysql: \*mysql\n  session:\n    addr: .*\n    notCluster: .*\n    password: "p@ss:word/1#"\n    ssl: .*\n    username: "reduser"\n'

  - it: "ai-server layoutBroker/layoutResultBroker render a percent-encoded reserved-character password"
    templates:
      - ../templates/resources/layout-config-py.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.enabled: false
      cache.existing.addr: cache.existing.com
      cache.password: "p@ss:word/1#"
      cache.username: reduser
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'layoutBroker="redis://reduser:p%40ss%3Aword%2F1%23@cache\.existing\.com:6379/0"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'layoutResultBroker="redis://reduser:p%40ss%3Aword%2F1%23@cache\.existing\.com:6379/0"'
      - notMatchRegex:
          path: stringData["config.py"]
          pattern: 'p@ss:word/1#'

  - it: "ai-server summaryBroker/summaryResultBroker render the shared-password form with no username"
    templates:
      - ../templates/resources/summary-config-py.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.enabled: false
      cache.existing.addr: cache.existing.com
      cache.password: sharedpass
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'summaryBroker="redis://:sharedpass@cache\.existing\.com:6379/0"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'summaryResultBroker="redis://:sharedpass@cache\.existing\.com:6379/0"'

  - it: "ai-server broker userinfo percent-encodes a space as %20, not the QueryEscape default '+'"
    templates:
      - ../templates/resources/layout-config-py.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.enabled: false
      cache.existing.addr: cache.existing.com
      cache.password: "my pass"
      cache.username: "my user"
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'layoutBroker="redis://my%20user:my%20pass@cache\.existing\.com:6379/0"'
      - notMatchRegex:
          path: stringData["config.py"]
          pattern: 'layoutBroker="redis://my\+user'

  - it: "default values (no credential set) render config-yaml.yaml byte-identical to 0.2.7 - no password/username keys"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'rec:\n  mysql: \*mysql\n  session:\n    addr: cache\.eyelevel\.svc\.cluster\.local:6379\n    notCluster: true\n    ssl: false\n'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'session:\n    addr: cache-metrics\.eyelevel\.svc\.cluster\.local:6379\n    notCluster: true\n    ssl: false\n'

  - it: "default values (no credential set) render layout-config-py.yaml with a credential-free broker URL"
    templates:
      - ../templates/resources/layout-config-py.yaml
    values:
      - ../values.yaml
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'layoutBroker="redis://[^:@]+:6379/0"'

  - it: "an undeclared cache key still hard-fails the render (schema stays additionalProperties:false)"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    set:
      cache.passwrod: typo
    asserts:
      - failedTemplate: {}

  - it: "a credential on the chart's own bundled cache fails the render loudly"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    set:
      cache.password: r3dispass
    asserts:
      - failedTemplate:
          errorMessage: "cache.password/cache.username require an external Redis (cache.existing.addr); the chart's own bundled Redis has no AUTH support"

  - it: "a username-only credential on the chart's own bundled cache also fails the render loudly"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    set:
      cache.username: reduser
    asserts:
      - failedTemplate:
          errorMessage: "cache.password/cache.username require an external Redis (cache.existing.addr); the chart's own bundled Redis has no AUTH support"

  - it: "cache.enabled=false with no existing.addr still fails loudly - resolved addr is the chart's own bundled DNS, not external (F4 bug (i))"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    set:
      cache.enabled: false
      cache.password: r3dispass
    asserts:
      - failedTemplate:
          errorMessage: "cache.password/cache.username require an external Redis (cache.existing.addr); the chart's own bundled Redis has no AUTH support"

  - it: "a username with no password on an external cache is rejected - nopass ACL is unsupported (decision a)"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.enabled: false
      cache.existing.addr: cache.existing.com
      cache.username: reduser
    asserts:
      - failedTemplate:
          errorMessage: "cache.username requires cache.password to also be set; a username with no password (nopass ACL) is not supported"
