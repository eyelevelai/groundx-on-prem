suite: "inference renders as expected"
chart:
  appVersion: 0.1.0
  version: 0.1.0

set:
  search:
    password: fixture-app-credential
    privilegedPassword: fixture-admin-credential

tests:
  - it: "default: inference"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ../values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "empty: inference"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ./files/values.empty.yaml
    asserts:
      - matchSnapshot: {}
  - it: "aws: inference"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ../values/values.aws.services.yaml
    asserts:
      - matchSnapshot: {}
  - it: "openshift: inference"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ../values/openshift/values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "minikube: inference"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ../values/minikube/values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "existing: inference"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ../values/values.existing.yaml
    asserts:
      - matchSnapshot: {}
  - it: "metadata: inference"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ./files/values.metadata.yaml
    asserts:
      - matchSnapshot: {}
  - it: "disabled: inference"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ./files/values.disabled.yaml
    asserts:
      - matchSnapshot: {}
  - it: "extract: inference"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ../values/extract/values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "extract.ingest: inference"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ./files/values.extract.ingest.yaml
    asserts:
      - matchSnapshot: {}
  - it: "extract.oai: inference"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ../values/extract/values.oai.yaml
    asserts:
      - matchSnapshot: {}
  - it: "cloud: inference"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ./files/values.cloud.yaml
    asserts:
      - matchSnapshot: {}
  - it: "phoenix: inference"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ./files/values.phoenix.yaml
    asserts:
      - matchSnapshot: {}
  - it: "workspace-enabled: inference"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ./files/values.disabled.yaml
      - ./files/values.workspace.enabled.yaml
    asserts:
      - matchSnapshot: {}
  - it: "layout cpu mode omits default gpu resources"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ../values.yaml
      - ./files/values.layout-inference.cpu.yaml
    documentSelector:
      path: metadata.name
      value: layout-inference
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources.requests["nvidia.com/gpu"]
      - notExists:
          path: spec.template.spec.containers[0].resources.limits["nvidia.com/gpu"]
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 500m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 2Gi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 12Gi
      - notExists:
          path: spec.template.spec.initContainers[?(@.name=="init-layout")].resources.requests["nvidia.com/gpu"]
      - notExists:
          path: spec.template.spec.initContainers[?(@.name=="init-layout")].resources.limits["nvidia.com/gpu"]
  - it: "layout cpu mode omits zero gpu override"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ../values.yaml
      - ./files/values.layout-inference.cpu-zero-gpu.yaml
    documentSelector:
      path: metadata.name
      value: layout-inference
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources.requests["nvidia.com/gpu"]
      - notExists:
          path: spec.template.spec.containers[0].resources.limits["nvidia.com/gpu"]
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 500m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 2Gi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 12Gi
  - it: "layout cpu mode omits gpu after partial non-gpu override"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ../values.yaml
      - ./files/values.layout-inference.cpu-non-gpu-resources.yaml
    documentSelector:
      path: metadata.name
      value: layout-inference
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources.requests["nvidia.com/gpu"]
      - notExists:
          path: spec.template.spec.containers[0].resources.limits["nvidia.com/gpu"]
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 750m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 3Gi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 10Gi
  - it: "layout cpu mode preserves explicit node placement"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ../values.yaml
      - ./files/values.layout-inference.cpu-placement.yaml
    documentSelector:
      path: metadata.name
      value: layout-inference
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.workload
          value: layout-cpu
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values[0]
          value: custom-layout-node
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: workload
            operator: Equal
            value: layout-cpu
            effect: NoSchedule
  - it: "default layout inference keeps gpu resources"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ../values.yaml
    documentSelector:
      path: metadata.name
      value: layout-inference
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests["nvidia.com/gpu"]
          value: 1
      - equal:
          path: spec.template.spec.containers[0].resources.limits["nvidia.com/gpu"]
          value: 1
  - it: "layout inference defaults to a 900 second grace period and replaces the shell with supervisord without running init-layout"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ../values.yaml
    documentSelector:
      path: metadata.name
      value: layout-inference
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
      - equal:
          path: spec.template.spec.containers[0].command[2]
          value: "export PYTHONPATH=/app:$PYTHONPATH && exec supervisord -c /app/supervisord.conf\n"
      - equal:
          path: spec.template.spec.initContainers[4].name
          value: init-layout
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=="init-layout")].command[2]
          pattern: "exec python /app/init-layout\\.py"
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="init-layout")].resources.requests["nvidia.com/gpu"]
          value: 1
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="init-layout")].resources.limits["nvidia.com/gpu"]
          value: 1
  - it: "ranker and summary gracePeriod override each service only and leave layout-inference alone (polarity: finalize success; must not block)"
    templates:
      - ../templates/app/inference.yaml
      - ../templates/resources/ranker-supervisord-conf.yaml
      - ../templates/resources/summary-supervisord-conf.yaml
    values:
      - ../values.yaml
    set:
      ranker.inference.replicas.gracePeriod: 120
      summary.inference.replicas.gracePeriod: 150
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 120
        documentSelector:
          path: metadata.name
          value: ranker-inference
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 150
        documentSelector:
          path: metadata.name
          value: summary-inference
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
        documentSelector:
          path: metadata.name
          value: layout-inference
      - matchRegex:
          path: data["supervisord.conf"]
          pattern: "(?s)\\[program:celery_worker_1\\].*stopwaitsecs=90\\n"
        documentSelector:
          path: metadata.name
          value: ranker-inference-supervisord-conf-map
      - matchRegex:
          path: data["supervisord.conf"]
          pattern: "(?s)\\[program:celery_worker_1\\].*stopwaitsecs=120\\n"
        documentSelector:
          path: metadata.name
          value: summary-inference-supervisord-conf-map
  - it: "ranker and summary gracePeriod under 31 floors the stop wait at 1 second (polarity: finalize success)"
    templates:
      - ../templates/resources/ranker-supervisord-conf.yaml
      - ../templates/resources/summary-supervisord-conf.yaml
    values:
      - ../values.yaml
    set:
      ranker.inference.replicas.gracePeriod: 20
      summary.inference.replicas.gracePeriod: 20
    asserts:
      - matchRegex:
          path: data["supervisord.conf"]
          pattern: "(?s)\\[program:celery_worker_1\\].*stopwaitsecs=1\\n"
        documentSelector:
          path: metadata.name
          value: ranker-inference-supervisord-conf-map
      - matchRegex:
          path: data["supervisord.conf"]
          pattern: "(?s)\\[program:celery_worker_1\\].*stopwaitsecs=1\\n"
        documentSelector:
          path: metadata.name
          value: summary-inference-supervisord-conf-map
  - it: "ranker workers override resizes the group to every worker (polarity: finalize success; catches)"
    templates:
      - ../templates/resources/ranker-supervisord-conf.yaml
    values:
      - ../values.yaml
    set:
      ranker.inference.workers: 3
    asserts:
      - matchRegex:
          path: data["supervisord.conf"]
          pattern: "\\[group:celery_workers\\]\\nprograms=celery_worker_1,celery_worker_2,celery_worker_3\\n"
      - notMatchRegex:
          path: data["supervisord.conf"]
          pattern: "(?s)(stopwaitsecs=870\\n.*){4}"
  - it: "summary workers override resizes the group to every worker (polarity: finalize success; catches)"
    templates:
      - ../templates/resources/summary-supervisord-conf.yaml
    values:
      - ../values.yaml
    set:
      summary.inference.workers: 2
    asserts:
      - matchRegex:
          path: data["supervisord.conf"]
          pattern: "(?s)(stopwaitsecs=270\\n.*){2}"
      - matchRegex:
          path: data["supervisord.conf"]
          pattern: "\\[group:celery_workers\\]\\nprograms=celery_worker_1,celery_worker_2\\n"
  - it: "layout inference init-layout carries the file-access CA env, CA mount and workload secrets"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ../values.yaml
      - ./files/values.file-access.yaml
    documentSelector:
      path: metadata.name
      value: layout-inference
    asserts:
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="init-layout")].env
          content:
            name: SSL_CERT_FILE
            value: /var/run/groundx/file-access/ca.crt
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="init-layout")].volumeMounts
          content:
            name: file-access-ca
            mountPath: /var/run/groundx/file-access
            readOnly: true
      - contains:
          path: spec.template.spec.initContainers[?(@.name=="init-layout")].envFrom
          content:
            secretRef:
              name: file-store-credentials
  - it: "ranker gracePeriod of zero fails schema validation before anything renders (polarity: reject before state)"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ../values.yaml
    set:
      ranker.inference.replicas.gracePeriod: 0
    asserts:
      - failedTemplate:
          errorPattern: "ranker/inference/replicas/gracePeriod.*minimum: got 0, want 1"
  - it: "summary gracePeriod of zero fails schema validation before anything renders (polarity: reject before state)"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ../values.yaml
    set:
      summary.inference.replicas.gracePeriod: 0
    asserts:
      - failedTemplate:
          errorPattern: "summary/inference/replicas/gracePeriod.*minimum: got 0, want 1"
