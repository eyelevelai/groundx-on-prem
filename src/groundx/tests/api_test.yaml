suite: "api renders as expected"
chart:
  appVersion: 0.1.0
  version: 0.1.0

tests:
  - it: "default: api"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "empty: api"
    templates:
      - ../templates/app/api.yaml
    values:
      - ./files/values.empty.yaml
    asserts:
      - matchSnapshot: {}
  - it: "aws: api"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values/values.aws.services.yaml
    asserts:
      - matchSnapshot: {}
  - it: "openshift: api"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values/openshift/values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "minikube: api"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values/minikube/values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "existing: api"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values/values.existing.yaml
    asserts:
      - matchSnapshot: {}
  - it: "metadata: api"
    templates:
      - ../templates/app/api.yaml
    values:
      - ./files/values.metadata.yaml
    asserts:
      - matchSnapshot: {}
  - it: "disabled: api"
    templates:
      - ../templates/app/api.yaml
    values:
      - ./files/values.disabled.yaml
    asserts:
      - matchSnapshot: {}
  - it: "extract: api"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values/extract/values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "extract.ingest: api"
    templates:
      - ../templates/app/api.yaml
    values:
      - ./files/values.extract.ingest.yaml
    asserts:
      - matchSnapshot: {}
  - it: "extract.oai: api"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values/extract/values.oai.yaml
    asserts:
      - matchSnapshot: {}
  - it: "cloud: api"
    templates:
      - ../templates/app/api.yaml
    values:
      - ./files/values.cloud.yaml
    asserts:
      - matchSnapshot: {}
  - it: "phoenix: api"
    templates:
      - ../templates/app/api.yaml
    values:
      - ./files/values.phoenix.yaml
    asserts:
      - matchSnapshot: {}
  - it: "workspace-enabled: api"
    templates:
      - ../templates/app/api.yaml
    values:
      - ./files/values.disabled.yaml
      - ./files/values.workspace.enabled.yaml
    asserts:
      - matchSnapshot: {}
  - it: "default: extract api probe timing"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values/extract/values.yaml
    documentSelector:
      path: spec.template.metadata.labels.app
      value: extract-api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 3
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 12
  - it: "default: layout api probe timing"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    documentSelector:
      path: spec.template.metadata.labels.app
      value: layout-api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 3
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 12
  - it: "default: ranker api probe timing"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    documentSelector:
      path: spec.template.metadata.labels.app
      value: ranker-api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 3
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 12
  - it: "default: summary api probe timing"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    documentSelector:
      path: spec.template.metadata.labels.app
      value: summary-api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 3
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 12
  - it: "enabled: workspace api probe timing"
    templates:
      - ../templates/app/api.yaml
    values:
      - ./files/values.disabled.yaml
      - ./files/values.workspace.yaml
    documentSelector:
      path: spec.template.metadata.labels.app
      value: workspace-api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 3
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 12
  - it: "override: layout api probe timing takes effect"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    set:
      layout.api.probe.liveness.timeoutSeconds: 7
      layout.api.probe.readiness.timeoutSeconds: 9
      layout.api.probe.readiness.failureThreshold: 5
    documentSelector:
      path: spec.template.metadata.labels.app
      value: layout-api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 7
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 9
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 5
  - it: "override: layout api probe timing does not leak into the ranker api sibling"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    set:
      layout.api.probe.liveness.timeoutSeconds: 7
      layout.api.probe.readiness.timeoutSeconds: 9
      layout.api.probe.readiness.failureThreshold: 5
    documentSelector:
      path: spec.template.metadata.labels.app
      value: ranker-api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 3
  - it: "override: ranker api probe timing takes effect"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    set:
      ranker.api.probe.liveness.timeoutSeconds: 11
      ranker.api.probe.readiness.timeoutSeconds: 13
      ranker.api.probe.readiness.failureThreshold: 6
    documentSelector:
      path: spec.template.metadata.labels.app
      value: ranker-api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 11
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 13
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 6
  - it: "override: ranker api probe timing does not leak into the layout api sibling"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    set:
      ranker.api.probe.liveness.timeoutSeconds: 11
      ranker.api.probe.readiness.timeoutSeconds: 13
      ranker.api.probe.readiness.failureThreshold: 6
    documentSelector:
      path: spec.template.metadata.labels.app
      value: layout-api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 3
  - it: "override: summary api probe timing takes effect"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    set:
      summary.api.probe.liveness.timeoutSeconds: 15
      summary.api.probe.readiness.timeoutSeconds: 17
      summary.api.probe.readiness.failureThreshold: 8
    documentSelector:
      path: spec.template.metadata.labels.app
      value: summary-api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 15
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 17
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 8
  - it: "override: summary api probe timing does not leak into the layout api sibling"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    set:
      summary.api.probe.liveness.timeoutSeconds: 15
      summary.api.probe.readiness.timeoutSeconds: 17
      summary.api.probe.readiness.failureThreshold: 8
    documentSelector:
      path: spec.template.metadata.labels.app
      value: layout-api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 3
  - it: "override: extract api probe timing takes effect"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values/extract/values.yaml
    set:
      extract.api.probe.liveness.timeoutSeconds: 19
      extract.api.probe.readiness.timeoutSeconds: 21
      extract.api.probe.readiness.failureThreshold: 10
    documentSelector:
      path: spec.template.metadata.labels.app
      value: extract-api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 19
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 21
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 10
  - it: "override: extract api probe timing does not leak into the layout api sibling"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values/extract/values.yaml
    set:
      extract.api.probe.liveness.timeoutSeconds: 19
      extract.api.probe.readiness.timeoutSeconds: 21
      extract.api.probe.readiness.failureThreshold: 10
    documentSelector:
      path: spec.template.metadata.labels.app
      value: layout-api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 3
  - it: "override: workspace api probe timing takes effect"
    templates:
      - ../templates/app/api.yaml
    values:
      - ./files/values.disabled.yaml
      - ./files/values.workspace.yaml
    set:
      layout.api.enabled: true
      workspace.api.probe.liveness.timeoutSeconds: 23
      workspace.api.probe.readiness.timeoutSeconds: 25
      workspace.api.probe.readiness.failureThreshold: 12
    documentSelector:
      path: spec.template.metadata.labels.app
      value: workspace-api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 23
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 25
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 12
  - it: "override: workspace api probe timing does not leak into the layout api sibling"
    templates:
      - ../templates/app/api.yaml
    values:
      - ./files/values.disabled.yaml
      - ./files/values.workspace.yaml
    set:
      layout.api.enabled: true
      workspace.api.probe.liveness.timeoutSeconds: 23
      workspace.api.probe.readiness.timeoutSeconds: 25
      workspace.api.probe.readiness.failureThreshold: 12
    documentSelector:
      path: spec.template.metadata.labels.app
      value: layout-api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 3
  - it: "schema rejects an unknown key on the layout api probe block"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    set:
      layout.api.probe.liveness.retries: 5
    asserts:
      - failedTemplate:
          errorPattern: "layout/api/probe/liveness.*retries.*not allowed"
  - it: "schema rejects a non-integer readiness timeoutSeconds on the layout api probe block"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    set:
      layout.api.probe.readiness.timeoutSeconds: "soon"
    asserts:
      - failedTemplate:
          errorPattern: "layout/api/probe/readiness/timeoutSeconds.*want integer"
  - it: "schema rejects an unknown key on the ranker api probe block"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    set:
      ranker.api.probe.liveness.retries: 5
    asserts:
      - failedTemplate:
          errorPattern: "ranker/api/probe/liveness.*retries.*not allowed"
  - it: "schema rejects a non-integer readiness timeoutSeconds on the ranker api probe block"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    set:
      ranker.api.probe.readiness.timeoutSeconds: "soon"
    asserts:
      - failedTemplate:
          errorPattern: "ranker/api/probe/readiness/timeoutSeconds.*want integer"
  - it: "schema rejects an unknown key on the summary api probe block"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    set:
      summary.api.probe.liveness.retries: 5
    asserts:
      - failedTemplate:
          errorPattern: "summary/api/probe/liveness.*retries.*not allowed"
  - it: "schema rejects a non-integer readiness timeoutSeconds on the summary api probe block"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    set:
      summary.api.probe.readiness.timeoutSeconds: "soon"
    asserts:
      - failedTemplate:
          errorPattern: "summary/api/probe/readiness/timeoutSeconds.*want integer"
  - it: "schema rejects an unknown key on the extract api probe block"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values/extract/values.yaml
    set:
      extract.api.probe.liveness.retries: 5
    asserts:
      - failedTemplate:
          errorPattern: "extract/api/probe/liveness.*retries.*not allowed"
  - it: "schema rejects a non-integer readiness timeoutSeconds on the extract api probe block"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values/extract/values.yaml
    set:
      extract.api.probe.readiness.timeoutSeconds: "soon"
    asserts:
      - failedTemplate:
          errorPattern: "extract/api/probe/readiness/timeoutSeconds.*want integer"
  - it: "schema rejects an unknown key on the workspace api probe block"
    templates:
      - ../templates/app/api.yaml
    values:
      - ./files/values.disabled.yaml
      - ./files/values.workspace.yaml
    set:
      workspace.api.probe.liveness.retries: 5
    asserts:
      - failedTemplate:
          errorPattern: "workspace/api/probe/liveness.*retries.*not allowed"
  - it: "schema rejects a non-integer readiness timeoutSeconds on the workspace api probe block"
    templates:
      - ../templates/app/api.yaml
    values:
      - ./files/values.disabled.yaml
      - ./files/values.workspace.yaml
    set:
      workspace.api.probe.readiness.timeoutSeconds: "soon"
    asserts:
      - failedTemplate:
          errorPattern: "workspace/api/probe/readiness/timeoutSeconds.*want integer"
  - it: "schema rejects a zero readiness timeoutSeconds on the layout api probe block"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    set:
      layout.api.probe.readiness.timeoutSeconds: 0
    asserts:
      - failedTemplate:
          errorPattern: "layout/api/probe/readiness/timeoutSeconds.*minimum: got 0, want 1"
  - it: "schema rejects a zero readiness failureThreshold on the layout api probe block"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    set:
      layout.api.probe.readiness.failureThreshold: 0
    asserts:
      - failedTemplate:
          errorPattern: "layout/api/probe/readiness/failureThreshold.*minimum: got 0, want 1"
  - it: "schema rejects a zero liveness timeoutSeconds on the layout api probe block"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    set:
      layout.api.probe.liveness.timeoutSeconds: 0
    asserts:
      - failedTemplate:
          errorPattern: "layout/api/probe/liveness/timeoutSeconds.*minimum: got 0, want 1"
  - it: "schema rejects a zero readiness timeoutSeconds on the ranker api probe block"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    set:
      ranker.api.probe.readiness.timeoutSeconds: 0
    asserts:
      - failedTemplate:
          errorPattern: "ranker/api/probe/readiness/timeoutSeconds.*minimum: got 0, want 1"
  - it: "schema rejects a zero readiness timeoutSeconds on the summary api probe block"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values.yaml
    set:
      summary.api.probe.readiness.timeoutSeconds: 0
    asserts:
      - failedTemplate:
          errorPattern: "summary/api/probe/readiness/timeoutSeconds.*minimum: got 0, want 1"
  - it: "schema rejects a zero readiness timeoutSeconds on the extract api probe block"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values/extract/values.yaml
    set:
      extract.api.probe.readiness.timeoutSeconds: 0
    asserts:
      - failedTemplate:
          errorPattern: "extract/api/probe/readiness/timeoutSeconds.*minimum: got 0, want 1"
  - it: "schema rejects a zero readiness timeoutSeconds on the workspace api probe block"
    templates:
      - ../templates/app/api.yaml
    values:
      - ./files/values.disabled.yaml
      - ./files/values.workspace.yaml
    set:
      workspace.api.probe.readiness.timeoutSeconds: 0
