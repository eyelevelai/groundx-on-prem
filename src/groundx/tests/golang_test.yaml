suite: "golang renders as expected"
chart:
  appVersion: 0.1.0
  version: 0.1.0

set:
  search:
    password: fixture-app-credential
    privilegedPassword: fixture-admin-credential

tests:
  - it: "external DB: database migration"
    templates:
      - ../templates/app/schema-migration.yaml
    values:
      - ../values/values.existing.yaml
    release:
      upgrade: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchSnapshot: {}
  - it: "OpenShift: database migration"
    templates:
      - ../templates/app/schema-migration.yaml
    values:
      - ../values/openshift/values.yaml
    release:
      upgrade: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchSnapshot: {}
  - it: "minikube: database migration"
    templates:
      - ../templates/app/schema-migration.yaml
    values:
      - ../values/minikube/values.yaml
    release:
      upgrade: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchSnapshot: {}
  - it: "metadata: database migration"
    templates:
      - ../templates/app/schema-migration.yaml
    values:
      - ./files/values.metadata.yaml
    release:
      upgrade: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchSnapshot: {}
  - it: "database migration blocks upgrades before new Go workloads"
    templates:
      - ../templates/app/schema-migration.yaml
    release:
      name: upgrade-test
      upgrade: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-5"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - equal:
          path: spec.backoffLimit
          value: 0
      - equal:
          path: spec.activeDeadlineSeconds
          value: 900
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["-migrate-only"]
      - equal:
          path: spec.template.metadata.labels.app
          value: upgrade-test-schema-migration
      - notExists:
          path: spec.template.spec.initContainers
      - notExists:
          path: spec.template.spec.containers[0].ports
      - notExists:
          path: spec.template.spec.containers[0].env
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: upgrade-test-schema-migration
      - matchSnapshot: {}
  - it: "fresh install creates no database upgrade hook"
    templates:
      - ../templates/app/schema-migration.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: "worker-only upgrade still migrates with the GroundX image"
    templates:
      - ../templates/app/schema-migration.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      queue.enabled: true
      groundx.image: test.invalid/groundx:migration
    release:
      upgrade: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: test.invalid/groundx:migration
  - it: "disabled Go workloads create no migration hook"
    templates:
      - ../templates/app/schema-migration.yaml
    values:
      - ./files/values.disabled.yaml
    release:
      upgrade: true
    asserts:
      - hasDocuments:
          count: 0
  - it: "migration inherits security and credentials without workspace dependencies"
    templates:
      - ../templates/app/schema-migration.yaml
    values:
      - ./files/values.workspace.enabled.yaml
    set:
      groundx.image: test.invalid/groundx:migration
      groundx.serviceAccount.name: migration-account
      groundx.containerSecurityContext.readOnlyRootFilesystem: true
      groundx.nodeSelector.disktype: ssd
      groundx.annotations.example: test
      cluster.secrets: [database-credentials]
      cluster.imagePullSecrets: [private-images]
      imageType: chainguard
    release:
      upgrade: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: migration-account
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /home/nonroot/.cashbot/config.yaml
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: database-credentials
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: private-images
      - notExists:
          path: spec.template.spec.containers[0].env
      - equal:
          path: spec.template.metadata.labels.app
          value: RELEASE-NAME-schema-migration
  - it: "shared Google credentials: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.google-shared.yaml
    asserts:
      - matchSnapshot: {}
  - it: "delivery mounts shared credentials with OCR disabled"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.google-shared.yaml
    set:
      layout.ocr.enabled: false
    documentSelector:
      path: metadata.name
      value: large-file-delivery
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: large-file-credential-0
            secret:
              secretName: google-credentials
              items:
                - key: credentials.json
                  path: credentials.json
      - matchRegex:
          path: spec.template.metadata.annotations["google-credentials-hash"]
          pattern: "^[0-9a-f]{64}$"
  - it: "delivery mounts the external shared Secret and selected key"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.google-shared.yaml
    set:
      google.credentials: null
      google.existingSecret: "123"
      google.secretKey: "true"
    documentSelector:
      path: metadata.name
      value: large-file-delivery
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: large-file-credential-0
            secret:
              secretName: "123"
              items:
                - key: "true"
                  path: credentials.json
      - notExists:
          path: spec.template.metadata.annotations["google-credentials-hash"]
  - it: "delivery retains separate credentials when a shared source is configured"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.large-file.yaml
    set:
      google.existingSecret: company-google
    documentSelector:
      path: metadata.name
      value: large-file-delivery
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: large-file-credential-0
            secret:
              secretName: large-file-drive
              items:
                - key: service-account.json
                  path: credentials.json
      - notExists:
          path: spec.template.metadata.annotations["google-credentials-hash"]
  - it: "default: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "empty: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.empty.yaml
    asserts:
      - matchSnapshot: {}
  - it: "aws: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/values.aws.services.yaml
    asserts:
      - matchSnapshot: {}
  - it: "openshift: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/openshift/values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "minikube: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "existing: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/values.existing.yaml
    set:
      search.password: mypass
      search.privilegedPassword: admin
    asserts:
      - matchSnapshot: {}
  - it: "metadata: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.metadata.yaml
    asserts:
      - matchSnapshot: {}
  - it: "disabled: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.disabled.yaml
    asserts:
      - matchSnapshot: {}
  - it: "extract: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/extract/values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "extract.ingest: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.extract.ingest.yaml
    asserts:
      - matchSnapshot: {}
  - it: "extract.oai: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/extract/values.oai.yaml
    asserts:
      - matchSnapshot: {}
  - it: "cloud: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.cloud.yaml
    asserts:
      - matchSnapshot: {}
  - it: "phoenix: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.phoenix.yaml
    asserts:
      - matchSnapshot: {}
  - it: "workspace-enabled: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.disabled.yaml
      - ./files/values.workspace.enabled.yaml
    asserts:
      - matchSnapshot: {}
  - it: "summaryClient gracePeriod: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      summaryClient.replicas.gracePeriod: 900
    documentSelector:
      path: metadata.name
      value: summary-client
    asserts:
      - matchSnapshot: {}
  - it: "summaryClient pod honors a custom shutdown budget"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      summaryClient.replicas.gracePeriod: 600
    documentSelector:
      path: metadata.name
      value: summary-client
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 600
  - it: "process pod honors a custom shutdown budget independently"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      process.replicas.gracePeriod: 300
    documentSelector:
      path: metadata.name
      value: process
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 300
  - it: "upload pod honors a custom shutdown budget independently"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      upload.replicas.gracePeriod: 180
    documentSelector:
      path: metadata.name
      value: upload
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 180
  - it: "queue pod honors a custom shutdown budget independently"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      queue.replicas.gracePeriod: 60
    documentSelector:
      path: metadata.name
      value: queue
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60
  - it: "preProcess pod honors a custom shutdown budget independently"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      preProcess.replicas.gracePeriod: 45
    documentSelector:
      path: metadata.name
      value: pre-process
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 45
  - it: "a Go queue service pod with no gracePeriod set renders the 900-second default"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    documentSelector:
      path: metadata.name
      value: summary-client
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
  - it: "an explicit gracePeriod on one Go queue service leaves a sibling on the 900-second default"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      process.replicas.gracePeriod: 120
    documentSelector:
      path: metadata.name
      value: upload
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
  - it: "schema rejects a non-integer gracePeriod"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      summaryClient.replicas.gracePeriod: "soon"
    asserts:
      - failedTemplate: {}
  - it: "schema rejects an unknown key on a Go queue-service replicas block"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      summaryClient.replicas.timeoutSeconds: 30
    asserts:
      - failedTemplate: {}
  - it: "schema rejects a non-positive gracePeriod on a Go queue-service replicas block"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      summaryClient.replicas.gracePeriod: 0
    asserts:
      - failedTemplate: {}
  - it: "large-file kafka: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.large-file.yaml
    asserts:
      - matchSnapshot: {}
  - it: "large-file sqs: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.large-file.yaml
    set:
      stream.topics.largeFile.type: sqs
      stream.topics.largeFile.url: https://sqs.us-west-2.amazonaws.com/123456789012/large-file
      stream.topics.largeFile.region: us-west-2
    asserts:
      - matchSnapshot: {}
  - it: creates the enabled worker with bounded concurrency and mounted credentials
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.large-file.yaml
    documentSelector:
      path: metadata.name
      value: large-file-delivery
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: test.invalid/large-file-delivery:local
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: large-file-credential-0
            mountPath: /var/run/groundx/large-file/operations-drive
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: large-file-credential-0
            secret:
              secretName: large-file-drive
              items:
                - key: service-account.json
                  path: credentials.json
  - it: mounts no Drive credentials in the producer
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.large-file.yaml
    documentSelector:
      path: metadata.name
      value: queue
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 1
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1
  - it: "groundx.replicas.gracePeriod overrides the pod and the block for groundx only"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      groundx.replicas.gracePeriod: 300
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 300
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: groundx
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 150
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: layout-webhook
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: process
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "groundxServer:\n  baseURL: .*\n  drainSeconds: 270\n"
        template: ../templates/resources/config-yaml.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "layoutWebhookServer:\n  baseURL: .*\n  drainSeconds: 120\n"
        template: ../templates/resources/config-yaml.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "processFileServer:\n  baseURL: .*\n  drainSeconds: 870\n"
        template: ../templates/resources/config-yaml.yaml
  - it: "groundx gracePeriod under 31 floors drainSeconds at 1"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      groundx.replicas.gracePeriod: 20
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "groundxServer:\n  baseURL: .*\n  drainSeconds: 1\n"
  - it: "groundx gracePeriod of zero is rejected before anything renders"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      groundx.replicas.gracePeriod: 0
    asserts:
      - failedTemplate:
          errorPattern: "groundx/replicas/gracePeriod.*minimum: got 0, want 1"
  - it: "layoutWebhook.replicas.gracePeriod changes layout-webhook only"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      layoutWebhook.replicas.gracePeriod: 60
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: layout-webhook
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 150
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: groundx
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "layoutWebhookServer:\n  baseURL: .*\n  drainSeconds: 30\n"
        template: ../templates/resources/config-yaml.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "groundxServer:\n  baseURL: .*\n  drainSeconds: 120\n"
        template: ../templates/resources/config-yaml.yaml
  - it: "layoutWebhook gracePeriod of zero is rejected before anything renders"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      layoutWebhook.replicas.gracePeriod: 0
    asserts:
      - failedTemplate:
          errorPattern: "layoutWebhook/replicas/gracePeriod.*minimum: got 0, want 1"
  - it: "file-access pod and block render 150 and 120 by default"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.file-access.yaml
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 150
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: file-access
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "fileAccessServer:\n  drainSeconds: 120\n  port: "
        template: ../templates/resources/config-yaml.yaml
  - it: "fileAccess.gracePeriod changes file-access only and fileAccess.replicas stays an integer"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.file-access.yaml
    set:
      fileAccess.gracePeriod: 100
      fileAccess.replicas: 3
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 100
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: file-access
      - equal:
          path: spec.replicas
          value: 3
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: file-access
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 150
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: groundx
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "fileAccessServer:\n  drainSeconds: 70\n  port: "
        template: ../templates/resources/config-yaml.yaml
  - it: "fileAccess gracePeriod of zero is rejected before anything renders"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.file-access.yaml
    set:
      fileAccess.gracePeriod: 0
    asserts:
      - failedTemplate:
          errorPattern: "fileAccess/gracePeriod.*minimum: got 0, want 1"
  - it: "fileAccess.replicas rejects an object so gracePeriod cannot hide under it"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.file-access.yaml
    set:
      fileAccess.replicas:
        gracePeriod: 100
    asserts:
      - failedTemplate:
          errorPattern: "fileAccess/replicas"
  - it: "all seven queue services render 900 and 870 by default"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.large-file.yaml
      - ./files/values.post-process.yaml
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: large-file-delivery
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: post-process
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: process
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "largeFileDeliveryServer:\n  drainSeconds: 870\n  maxConcurrent: "
        template: ../templates/resources/config-yaml.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "postProcessFileServer:\n  drainSeconds: 870\n  maxConcurrent: "
        template: ../templates/resources/config-yaml.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "uploadFileServer:\n  baseURL: .*\n  drainSeconds: 870\n"
        template: ../templates/resources/config-yaml.yaml
  - it: "largeFileDeliver.replicas.gracePeriod changes large-file-delivery only"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.large-file.yaml
      - ./files/values.post-process.yaml
    set:
      largeFileDeliver.replicas.gracePeriod: 120
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 120
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: large-file-delivery
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: post-process
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "largeFileDeliveryServer:\n  drainSeconds: 90\n"
        template: ../templates/resources/config-yaml.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "postProcessFileServer:\n  drainSeconds: 870\n"
        template: ../templates/resources/config-yaml.yaml
  - it: "an override on one of the five existing queue services leaves the other six on the default"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.large-file.yaml
      - ./files/values.post-process.yaml
    set:
      upload.replicas.gracePeriod: 180
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 180
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: upload
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: large-file-delivery
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "uploadFileServer:\n  baseURL: .*\n  drainSeconds: 150\n"
        template: ../templates/resources/config-yaml.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "largeFileDeliveryServer:\n  drainSeconds: 870\n"
        template: ../templates/resources/config-yaml.yaml
  - it: "largeFileDeliver gracePeriod of zero is rejected before anything renders"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.large-file.yaml
    set:
      largeFileDeliver.replicas.gracePeriod: 0
    asserts:
      - failedTemplate:
          errorPattern: "largeFileDeliver/replicas/gracePeriod.*minimum: got 0, want 1"
  - it: "a bare largeFileDeliver.replicas.gracePeriod renders without setting desired"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.large-file.yaml
    set:
      largeFileDeliver.replicas.gracePeriod: 120
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 120
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: large-file-delivery
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "largeFileDeliveryServer:\n  drainSeconds: 90\n"
        template: ../templates/resources/config-yaml.yaml
