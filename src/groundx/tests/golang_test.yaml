suite: "golang renders as expected"
chart:
  appVersion: 0.1.0
  version: 0.1.0

tests:
  - it: "external DB: database migration"
    templates:
      - ../templates/app/schema-migration.yaml
    values:
      - ../values/values.existing.yaml
    release:
      upgrade: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchSnapshot: {}
  - it: "OpenShift: database migration"
    templates:
      - ../templates/app/schema-migration.yaml
    values:
      - ../values/openshift/values.yaml
    release:
      upgrade: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchSnapshot: {}
  - it: "minikube: database migration"
    templates:
      - ../templates/app/schema-migration.yaml
    values:
      - ../values/minikube/values.yaml
    release:
      upgrade: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchSnapshot: {}
  - it: "metadata: database migration"
    templates:
      - ../templates/app/schema-migration.yaml
    values:
      - ./files/values.metadata.yaml
    release:
      upgrade: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchSnapshot: {}
  - it: "database migration blocks upgrades before new Go workloads"
    templates:
      - ../templates/app/schema-migration.yaml
    release:
      name: upgrade-test
      upgrade: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-5"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - equal:
          path: spec.backoffLimit
          value: 0
      - equal:
          path: spec.activeDeadlineSeconds
          value: 900
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["-migrate-only"]
      - equal:
          path: spec.template.metadata.labels.app
          value: upgrade-test-schema-migration
      - notExists:
          path: spec.template.spec.initContainers
      - notExists:
          path: spec.template.spec.containers[0].ports
      - notExists:
          path: spec.template.spec.containers[0].env
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: upgrade-test-schema-migration
      - matchSnapshot: {}
  - it: "fresh install creates no database upgrade hook"
    templates:
      - ../templates/app/schema-migration.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: "worker-only upgrade still migrates with the GroundX image"
    templates:
      - ../templates/app/schema-migration.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      queue.enabled: true
      groundx.image: test.invalid/groundx:migration
    release:
      upgrade: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: test.invalid/groundx:migration
  - it: "disabled Go workloads create no migration hook"
    templates:
      - ../templates/app/schema-migration.yaml
    values:
      - ./files/values.disabled.yaml
    release:
      upgrade: true
    asserts:
      - hasDocuments:
          count: 0
  - it: "migration inherits security and credentials without workspace dependencies"
    templates:
      - ../templates/app/schema-migration.yaml
    values:
      - ./files/values.workspace.enabled.yaml
    set:
      groundx.image: test.invalid/groundx:migration
      groundx.serviceAccount.name: migration-account
      groundx.containerSecurityContext.readOnlyRootFilesystem: true
      groundx.nodeSelector.disktype: ssd
      groundx.annotations.example: test
      cluster.secrets: [database-credentials]
      cluster.imagePullSecrets: [private-images]
      imageType: chainguard
    release:
      upgrade: true
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: migration-account
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /home/nonroot/.cashbot/config.yaml
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: database-credentials
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: private-images
      - notExists:
          path: spec.template.spec.containers[0].env
      - equal:
          path: spec.template.metadata.labels.app
          value: RELEASE-NAME-schema-migration
  - it: "shared Google credentials: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.google-shared.yaml
    asserts:
      - matchSnapshot: {}
  - it: "delivery mounts shared credentials with OCR disabled"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.google-shared.yaml
    set:
      layout.ocr.enabled: false
    documentSelector:
      path: metadata.name
      value: large-file-delivery
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: large-file-credential-0
            secret:
              secretName: google-credentials
              items:
                - key: credentials.json
                  path: credentials.json
      - matchRegex:
          path: spec.template.metadata.annotations["google-credentials-hash"]
          pattern: "^[0-9a-f]{64}$"
  - it: "delivery mounts the external shared Secret and selected key"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.google-shared.yaml
    set:
      google.credentials: null
      google.existingSecret: "123"
      google.secretKey: "true"
    documentSelector:
      path: metadata.name
      value: large-file-delivery
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: large-file-credential-0
            secret:
              secretName: "123"
              items:
                - key: "true"
                  path: credentials.json
      - notExists:
          path: spec.template.metadata.annotations["google-credentials-hash"]
  - it: "delivery retains separate credentials when a shared source is configured"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.large-file.yaml
    set:
      google.existingSecret: company-google
    documentSelector:
      path: metadata.name
      value: large-file-delivery
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: large-file-credential-0
            secret:
              secretName: large-file-drive
              items:
                - key: service-account.json
                  path: credentials.json
      - notExists:
          path: spec.template.metadata.annotations["google-credentials-hash"]
  - it: "default: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "empty: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.empty.yaml
    asserts:
      - matchSnapshot: {}
  - it: "aws: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/values.aws.services.yaml
    asserts:
      - matchSnapshot: {}
  - it: "openshift: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/openshift/values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "minikube: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "existing: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/values.existing.yaml
    asserts:
      - matchSnapshot: {}
  - it: "metadata: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.metadata.yaml
    asserts:
      - matchSnapshot: {}
  - it: "disabled: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.disabled.yaml
    asserts:
      - matchSnapshot: {}
  - it: "extract: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/extract/values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "extract.ingest: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.extract.ingest.yaml
    asserts:
      - matchSnapshot: {}
  - it: "extract.oai: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/extract/values.oai.yaml
    asserts:
      - matchSnapshot: {}
  - it: "cloud: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.cloud.yaml
    asserts:
      - matchSnapshot: {}
  - it: "phoenix: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.phoenix.yaml
    asserts:
      - matchSnapshot: {}
  - it: "workspace-enabled: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.disabled.yaml
      - ./files/values.workspace.enabled.yaml
    asserts:
      - matchSnapshot: {}
  - it: "summaryClient gracePeriod: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      summaryClient.replicas.gracePeriod: 900
    documentSelector:
      path: metadata.name
      value: summary-client
    asserts:
      - matchSnapshot: {}
  - it: "summaryClient pod honors a custom shutdown budget"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      summaryClient.replicas.gracePeriod: 900
    documentSelector:
      path: metadata.name
      value: summary-client
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
  - it: "process pod honors a custom shutdown budget independently"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      process.replicas.gracePeriod: 300
    documentSelector:
      path: metadata.name
      value: process
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 300
  - it: "upload pod honors a custom shutdown budget independently"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      upload.replicas.gracePeriod: 180
    documentSelector:
      path: metadata.name
      value: upload
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 180
  - it: "queue pod honors a custom shutdown budget independently"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      queue.replicas.gracePeriod: 60
    documentSelector:
      path: metadata.name
      value: queue
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60
  - it: "preProcess pod honors a custom shutdown budget independently"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      preProcess.replicas.gracePeriod: 45
    documentSelector:
      path: metadata.name
      value: pre-process
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 45
  - it: "a Go queue service pod with no gracePeriod set renders unchanged"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    documentSelector:
      path: metadata.name
      value: summary-client
    asserts:
      - notExists:
          path: spec.template.spec.terminationGracePeriodSeconds
  - it: "schema rejects a non-integer gracePeriod"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      summaryClient.replicas.gracePeriod: "soon"
    asserts:
      - failedTemplate: {}
  - it: "schema rejects an unknown key on a Go queue-service replicas block"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      summaryClient.replicas.timeoutSeconds: 30
    asserts:
      - failedTemplate: {}
  - it: "schema rejects a non-positive gracePeriod on a Go queue-service replicas block"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      summaryClient.replicas.gracePeriod: 0
    asserts:
      - failedTemplate: {}
  - it: "large-file kafka: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.large-file.yaml
    asserts:
      - matchSnapshot: {}
  - it: "large-file sqs: golang"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.large-file.yaml
    set:
      stream.topics.largeFile.type: sqs
      stream.topics.largeFile.url: https://sqs.us-west-2.amazonaws.com/123456789012/large-file
      stream.topics.largeFile.region: us-west-2
    asserts:
      - matchSnapshot: {}
  - it: creates the enabled worker with bounded concurrency and mounted credentials
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.large-file.yaml
    documentSelector:
      path: metadata.name
      value: large-file-delivery
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: test.invalid/large-file-delivery:local
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: large-file-credential-0
            mountPath: /var/run/groundx/large-file/operations-drive
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: large-file-credential-0
            secret:
              secretName: large-file-drive
              items:
                - key: service-account.json
                  path: credentials.json
  - it: mounts no Drive credentials in the producer
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.large-file.yaml
    documentSelector:
      path: metadata.name
      value: queue
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 1
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1
