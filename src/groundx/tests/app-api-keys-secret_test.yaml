suite: "Application API keys (extract/ranker) Secret-backed path (GX-17)"

tests:
  - it: "existingSecret set, admin values empty: extract config reads env fallback and pods get groundx-admin-secret envFrom"
    templates:
      - ../templates/resources/extract-config-py.yaml
      - ../templates/app/celery.yaml
      - ../templates/resources/secret.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      extract.enabled: true
      extract.agent.enabled: true
      admin.existingSecret: true
    asserts:
      - matchRegex:
          path: data["config.py"]
          pattern: 'callback_api_key=os\.environ\.get\("GROUNDX_ADMIN_USERNAME", ""\)'
        template: ../templates/resources/extract-config-py.yaml
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: groundx-admin-secret
        template: ../templates/app/celery.yaml
        documentSelector:
          path: metadata.name
          value: extract-agent
      - hasDocuments:
          count: 0
        template: ../templates/resources/secret.yaml
  - it: "catches: existingSecret set but admin.username also set - config wins, plaintext still renders"
    templates:
      - ../templates/resources/extract-config-py.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      extract.enabled: true
      extract.agent.enabled: true
      admin.existingSecret: true
      admin.username: test-admin-user
    asserts:
      - matchRegex:
          path: data["config.py"]
          pattern: 'callback_api_key="test-admin-user"'
  - it: "plaintext path: admin.apiKey set, existingSecret unset - chart creates groundx-admin-secret (dev path)"
    templates:
      - ../templates/resources/secret.yaml
      - ../templates/app/celery.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      extract.enabled: true
      extract.agent.enabled: true
      extract.agent.apiKey: ""
      admin.apiKey: test-admin-key
    asserts:
      - equal:
          path: metadata.name
          value: groundx-admin-secret
        template: ../templates/resources/secret.yaml
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: groundx-admin-secret
        template: ../templates/app/celery.yaml
        documentSelector:
          path: metadata.name
          value: extract-agent
  - it: "must not block: neither admin.apiKey/username nor existingSecret set - unchanged"
    templates:
      - ../templates/resources/extract-config-py.yaml
      - ../templates/resources/secret.yaml
      - ../templates/app/celery.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      extract.enabled: true
      extract.agent.enabled: true
    asserts:
      - matchRegex:
          path: data["config.py"]
          pattern: 'callback_api_key="",'
        template: ../templates/resources/extract-config-py.yaml
      - hasDocuments:
          count: 0
        template: ../templates/resources/secret.yaml
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: groundx-admin-secret
        template: ../templates/app/celery.yaml
        documentSelector:
          path: metadata.name
          value: extract-agent
