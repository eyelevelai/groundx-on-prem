suite: optional post-processing
tests:
  - it: creates the dedicated worker with shared probes and image
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.post-process.yaml
    documentSelector:
      path: metadata.name
      value: post-process
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: test.invalid/post-process:local
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.replicas
          value: 1
  - it: adds no topic when disabled
    templates:
      - ../templates/services/stream-topics.yaml
    asserts:
      - hasDocuments:
          count: 5
  - it: creates the configured Kafka topic and worker partitions
    templates:
      - ../templates/services/stream-topics.yaml
    values:
      - ./files/values.post-process.yaml
    set:
      postProcess.replicas.desired: 3
      stream.topics.postProcess.topic: custom-post-process
      stream.topics.postProcess.groupId: custom-consumer
    documentSelector:
      path: metadata.name
      value: custom-post-process
    asserts:
      - isKind:
          of: KafkaTopic
      - equal:
          path: spec.partitions
          value: 3
  - it: adds no Kafka topic for SQS
    templates:
      - ../templates/services/stream-topics.yaml
    values:
      - ./files/values.post-process.yaml
    set:
      stream.topics.postProcess.type: sqs
      stream.topics.postProcess.url: https://sqs.us-west-2.amazonaws.com/123456789012/post-process
      stream.topics.postProcess.region: us-west-2
    asserts:
      - hasDocuments:
          count: 5
  - it: "postProcess.replicas.gracePeriod changes post-process only"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.large-file.yaml
      - ./files/values.post-process.yaml
    set:
      postProcess.replicas.gracePeriod: 200
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 200
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: post-process
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: large-file-delivery
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "postProcessFileServer:\n  drainSeconds: 170\n"
        template: ../templates/resources/config-yaml.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "largeFileDeliveryServer:\n  drainSeconds: 870\n"
        template: ../templates/resources/config-yaml.yaml
  - it: "postProcess gracePeriod that is not an integer is rejected before anything renders"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.post-process.yaml
    set:
      postProcess.replicas.gracePeriod: "soon"
    asserts:
      - failedTemplate:
          errorPattern: "postProcess/replicas/gracePeriod"
  - it: "a bare postProcess.replicas.gracePeriod renders without setting desired"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.post-process.yaml
    set:
      postProcess.replicas.gracePeriod: 200
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 200
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: post-process
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "postProcessFileServer:\n  drainSeconds: 170\n"
        template: ../templates/resources/config-yaml.yaml
