suite: "fileAccess shares the Go shutdown rule"
chart:
  appVersion: 0.1.0
  version: 0.1.0

set:
  search:
    password: fixture-app-credential
    privilegedPassword: fixture-admin-credential

tests:
  - it: "file-access pod and block render 150 and 120 by default"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.file-access.yaml
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 150
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: file-access
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "fileAccessServer:\n  drainSeconds: 120\n  port: "
        template: ../templates/resources/config-yaml.yaml
  - it: "fileAccess.gracePeriod changes file-access only and fileAccess.replicas stays an integer"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.file-access.yaml
    set:
      fileAccess.gracePeriod: 100
      fileAccess.replicas: 3
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 100
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: file-access
      - equal:
          path: spec.replicas
          value: 3
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: file-access
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 150
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: groundx
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "fileAccessServer:\n  drainSeconds: 70\n  port: "
        template: ../templates/resources/config-yaml.yaml
  - it: "fileAccess gracePeriod of zero is rejected before anything renders"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.file-access.yaml
    set:
      fileAccess.gracePeriod: 0
    asserts:
      - failedTemplate:
          errorPattern: "fileAccess/gracePeriod.*minimum: got 0, want 1"
  - it: "fileAccess gracePeriod that is not an integer is rejected before anything renders"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.file-access.yaml
    set:
      fileAccess.gracePeriod: "soon"
    asserts:
      - failedTemplate:
          errorPattern: "fileAccess/gracePeriod"
  - it: "fileAccess.replicas rejects an object so gracePeriod cannot hide under it"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.file-access.yaml
    set:
      fileAccess.replicas:
        gracePeriod: 100
    asserts:
      - failedTemplate:
          errorPattern: "fileAccess/replicas"
