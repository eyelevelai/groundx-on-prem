suite: "extract renders as expected"
chart:
  appVersion: 0.1.0
  version: 0.1.0

tests:
  - it: "extract-agent defaults fit one worker on a two-vCPU node"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      extract.enabled: true
      extract.agent.enabled: true
    documentSelector:
      path: metadata.name
      value: extract-agent
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 1400m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 1Gi
      - notExists:
          path: spec.template.spec.containers[0].resources.limits.cpu
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 2Gi
  - it: "extract-download defaults match its existing limits"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      extract.enabled: true
      extract.download.enabled: true
    documentSelector:
      path: metadata.name
      value: extract-download
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 1
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 1Gi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 1
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi
  - it: "default: extract.ingest"
    templates:
      - ../templates/resources/extract-config-py.yaml
    values:
      - ./files/values.extract.ingest.yaml
    asserts:
      - matchSnapshot: {}
  - it: "default: phoenix"
    templates:
      - ../templates/resources/extract-config-py.yaml
    values:
      - ./files/values.phoenix.yaml
    asserts:
      - matchSnapshot: {}
  - it: "default: extract.existing.1"
    set:
      extract.file.url: http://s3.com
    templates:
      - ../templates/resources/extract-config-py.yaml
    values:
      - ./files/values.phoenix.yaml
    asserts:
      - matchSnapshot: {}
  - it: "workspace-enabled: extract"
    templates:
      - ../templates/resources/extract-config-py.yaml
    values:
      - ./files/values.disabled.yaml
      - ./files/values.workspace.enabled.yaml
    asserts:
      - matchSnapshot: {}
  - it: "extract-agent supervisord waits for active tasks during shutdown"
    templates:
      - ../templates/resources/extract-supervisord-conf.yaml
    values:
      - ../values/extract/values.yaml
    documentSelector:
      path: metadata.name
      value: extract-agent-supervisord-conf-map
    asserts:
      - matchRegex:
          path: data["supervisord.conf"]
          pattern: "stopwaitsecs=870"
  - it: "extract-agent pod allows supervisor to drain"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ../values/extract/values.yaml
    documentSelector:
      path: metadata.name
      value: extract-agent
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
  - it: "extract-agent accepts credential-free S3 through workload identity"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      extract.enabled: true
      extract.agent.enabled: true
      extract.file.bucketName: eyelevel-upload
      extract.file.region: us-west-2
      extract.file.serviceType: s3
      extract.file.url: https://upload.groundx.ai
    documentSelector:
      path: metadata.name
      value: extract-agent
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].command[2]
          value: "until nc -z upload.groundx.ai 443; do echo waiting for file storage; sleep 2; done"
  - it: "extract storage inherits account-wide values field by field"
    templates:
      - ../templates/resources/extract-config-py.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      extract.enabled: true
      extract.file.bucketName: extract-bucket
      file.bucketName: account-bucket
      file.username: account-user
      file.password: account-secret
      file.existing.region: us-east-1
      file.existing.serviceType: minio
      file.existing.url: https://account-storage.example.com
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'bucket="extract-bucket"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'region="us-east-1"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'type="minio"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'url="https://account-storage.example.com/extract-bucket/"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'key="account-user"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'secret="account-secret"'
  - it: "empty extract credentials preserve platform credential injection"
    templates:
      - ../templates/resources/extract-config-py.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      extract.enabled: true
      extract.file.bucketName: ""
      extract.file.password: ""
      extract.file.region: ""
      extract.file.serviceType: ""
      extract.file.url: ""
      extract.file.username: ""
      file.bucketName: account-bucket
      file.username: account-user
      file.password: account-secret
      file.existing.region: us-west-2
      file.existing.serviceType: s3
      file.existing.url: https://account-bucket.s3.us-west-2.amazonaws.com
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'bucket="account-bucket"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'region="us-west-2"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'type="s3"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'url="https://account-bucket.s3.us-west-2.amazonaws.com/"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'key=""'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'secret=""'
  - it: "extract pods inherit the account-wide service account"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      extract.enabled: true
      extract.agent.enabled: true
      serviceAccount.name: account-workload-role
    documentSelector:
      path: metadata.name
      value: extract-agent
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: account-workload-role
  - it: "extract pod service account overrides the account-wide service account"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      extract.enabled: true
      extract.agent.enabled: true
      extract.agent.serviceAccount.name: extract-workload-role
      serviceAccount.name: account-workload-role
    documentSelector:
      path: metadata.name
      value: extract-agent
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: extract-workload-role
  - it: "extract-download pod allows supervisor to drain"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ../values/extract/values.yaml
    documentSelector:
      path: metadata.name
      value: extract-download
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
  - it: "extract-save pod allows supervisor to drain"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ../values/extract/values.yaml
    documentSelector:
      path: metadata.name
      value: extract-save
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
  - it: "extract-agent pod honors a custom shutdown budget"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ../values/extract/values.yaml
    set:
      extract.agent.replicas.gracePeriod: 120
    documentSelector:
      path: metadata.name
      value: extract-agent
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 120
  - it: "extract-agent supervisor keeps a margin inside a custom shutdown budget"
    templates:
      - ../templates/resources/extract-supervisord-conf.yaml
    values:
      - ../values/extract/values.yaml
    set:
      extract.agent.replicas.gracePeriod: 120
    documentSelector:
      path: metadata.name
      value: extract-agent-supervisord-conf-map
    asserts:
      - matchRegex:
          path: data["supervisord.conf"]
          pattern: "stopwaitsecs=90"
  - it: "extract-agent deployment drains celery consumers before termination"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ../values/extract/values.yaml
    documentSelector:
      path: metadata.name
      value: extract-agent
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command[2]
          pattern: "python -m celery -A celery_agents.app control cancel_consumer agent_queue"
  - it: "extract-agent deployment exposes image payload guard"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ../values/extract/values.yaml
    documentSelector:
      path: metadata.name
      value: extract-agent
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXTRACT_AGENT_MAX_IMAGE_PAYLOAD_BYTES
            value: "41943040"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXTRACT_AGENT_MAX_REQUEST_IMAGES
            value: "30"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXTRACT_AGENT_IMAGE_TRANSPORT
            value: "data_url"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXTRACT_AGENT_IMAGE_TARGET_LONG_EDGE_PX
            value: "1000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXTRACT_AGENT_IMAGE_MIN_LONG_EDGE_PX
            value: "900"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXTRACT_AGENT_IMAGE_JPEG_QUALITIES
            value: "20"
  - it: "extract-api receives terminal diagnostics disabled by default"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values/extract/values.yaml
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: extract-api
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXTRACTION_TERMINAL_AGENT_TRACE_ENABLED
            value: "false"
  - it: "extract-agent receives the shared terminal diagnostics value"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ../values/extract/values.yaml
    set:
      extract.terminalAgentTraceEnabled: true
    documentSelector:
      path: metadata.name
      value: extract-agent
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXTRACTION_TERMINAL_AGENT_TRACE_ENABLED
            value: "true"
  - it: "extract-agent receives terminal diagnostics disabled by default"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ../values/extract/values.yaml
    documentSelector:
      path: metadata.name
      value: extract-agent
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXTRACTION_TERMINAL_AGENT_TRACE_ENABLED
            value: "false"
  - it: "extract-download receives terminal diagnostics disabled by default"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ../values/extract/values.yaml
    documentSelector:
      path: metadata.name
      value: extract-download
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXTRACTION_TERMINAL_AGENT_TRACE_ENABLED
            value: "false"
  - it: "extract-save receives terminal diagnostics disabled by default"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ../values/extract/values.yaml
    documentSelector:
      path: metadata.name
      value: extract-save
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXTRACTION_TERMINAL_AGENT_TRACE_ENABLED
            value: "false"
  - it: "extract-api receives the shared terminal diagnostics value"
    templates:
      - ../templates/app/api.yaml
    values:
      - ../values/extract/values.yaml
    set:
      extract.terminalAgentTraceEnabled: true
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: extract-api
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXTRACTION_TERMINAL_AGENT_TRACE_ENABLED
            value: "true"
  - it: "extract-download receives the shared terminal diagnostics value"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ../values/extract/values.yaml
    set:
      extract.terminalAgentTraceEnabled: true
    documentSelector:
      path: metadata.name
      value: extract-download
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXTRACTION_TERMINAL_AGENT_TRACE_ENABLED
            value: "true"
  - it: "extract-save receives the shared terminal diagnostics value"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ../values/extract/values.yaml
    set:
      extract.terminalAgentTraceEnabled: true
    documentSelector:
      path: metadata.name
      value: extract-save
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXTRACTION_TERMINAL_AGENT_TRACE_ENABLED
            value: "true"
  - it: "extract-download explicit false overrides shared true"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ../values/extract/values.yaml
    set:
      extract.terminalAgentTraceEnabled: true
      extract.download.terminalAgentTraceEnabled: false
    documentSelector:
      path: metadata.name
      value: extract-download
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXTRACTION_TERMINAL_AGENT_TRACE_ENABLED
            value: "false"
  - it: "extract-save explicit true overrides shared false"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ../values/extract/values.yaml
    set:
      extract.terminalAgentTraceEnabled: false
      extract.save.terminalAgentTraceEnabled: true
    documentSelector:
      path: metadata.name
      value: extract-save
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXTRACTION_TERMINAL_AGENT_TRACE_ENABLED
            value: "true"
  - it: "extract config passes image transport into SDK agent settings"
    templates:
      - ../templates/resources/extract-config-py.yaml
    values:
      - ../values/extract/values.yaml
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: "image_transport=\"data_url\""
  - it: "bedrock extract config renders service and preserves configured transport"
    templates:
      - ../templates/resources/extract-config-py.yaml
    values:
      - ../values/extract/values.yaml
    set:
      extract.agent.apiBaseUrl: https://bedrock-mantle.us-west-2.api.aws/openai/v1
      extract.agent.modelId: google.gemma-4-31b
      extract.agent.serviceType: bedrock
      extract.agent.imageTransport: pil
      extract.file.bucketName: configured-bucket
      extract.file.region: us-west-2
      extract.file.serviceType: s3
      extract.file.url: https://configured-bucket.s3.us-west-2.amazonaws.com
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'service="bedrock"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'image_transport="pil"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'bucket="configured-bucket"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'type="s3"'
  - it: "bedrock extract config rejects non-S3 storage"
    templates:
      - ../templates/resources/extract-supervisord-conf.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      extract.enabled: true
      extract.agent.enabled: true
      extract.agent.serviceType: bedrock
    asserts:
      - failedTemplate:
          errorMessage: "extract.agent.serviceType bedrock requires AWS S3 file storage"
  - it: "bedrock extract config requires an endpoint"
    templates:
      - ../templates/resources/extract-supervisord-conf.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      extract.enabled: true
      extract.agent.enabled: true
      extract.agent.apiKey: bedrock-key
      extract.agent.modelId: google.gemma-4-31b
      extract.agent.serviceType: bedrock
      extract.file.bucketName: configured-bucket
      extract.file.region: us-west-2
      extract.file.serviceType: s3
      extract.file.url: https://configured-bucket.s3.us-west-2.amazonaws.com
    asserts:
      - failedTemplate:
          errorMessage: "extract.agent.serviceType bedrock requires extract.agent.apiBaseUrl"
  - it: "bedrock extract config requires a model"
    templates:
      - ../templates/resources/extract-supervisord-conf.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      extract.enabled: true
      extract.agent.enabled: true
      extract.agent.apiBaseUrl: https://bedrock-mantle.us-west-2.api.aws/openai/v1
      extract.agent.apiKey: bedrock-key
      extract.agent.serviceType: bedrock
      extract.file.bucketName: configured-bucket
      extract.file.region: us-west-2
      extract.file.serviceType: s3
      extract.file.url: https://configured-bucket.s3.us-west-2.amazonaws.com
    asserts:
      - failedTemplate:
          errorMessage: "extract.agent.serviceType bedrock requires extract.agent.modelId"
  - it: "bedrock extract config requires a Bedrock credential source"
    templates:
      - ../templates/resources/extract-supervisord-conf.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      admin.apiKey: groundx-admin-key
      extract.enabled: true
      extract.agent.enabled: true
      extract.agent.apiBaseUrl: https://bedrock-mantle.us-west-2.api.aws/openai/v1
      extract.agent.modelId: google.gemma-4-31b
      extract.agent.serviceType: bedrock
      extract.file.bucketName: configured-bucket
      extract.file.region: us-west-2
      extract.file.serviceType: s3
      extract.file.url: https://configured-bucket.s3.us-west-2.amazonaws.com
    asserts:
      - failedTemplate:
          errorMessage: "extract.agent.serviceType bedrock requires extract.agent.apiKey, extract.agent.existingSecret, or cluster.secrets"
  - it: "bedrock uses the configured cluster secret instead of the admin API key"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      admin.apiKey: groundx-admin-key
      cluster.secrets[0]: bedrock-credentials
      extract.enabled: true
      extract.agent.enabled: true
      extract.agent.apiBaseUrl: https://bedrock-mantle.us-west-2.api.aws/openai/v1
      extract.agent.modelId: google.gemma-4-31b
      extract.agent.serviceType: bedrock
      extract.file.bucketName: configured-bucket
      extract.file.region: us-west-2
      extract.file.serviceType: s3
      extract.file.url: https://configured-bucket.s3.us-west-2.amazonaws.com
    documentSelector:
      path: metadata.name
      value: extract-agent
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: bedrock-credentials
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: extract-agent-secret
  - it: "bedrock uses the configured extract agent secret"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      extract.enabled: true
      extract.agent.enabled: true
      extract.agent.apiBaseUrl: https://bedrock-mantle.us-west-2.api.aws/openai/v1
      extract.agent.existingSecret: true
      extract.agent.modelId: google.gemma-4-31b
      extract.agent.serviceType: bedrock
      extract.file.bucketName: configured-bucket
      extract.file.region: us-west-2
      extract.file.serviceType: s3
      extract.file.url: https://configured-bucket.s3.us-west-2.amazonaws.com
    documentSelector:
      path: metadata.name
      value: extract-agent
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: extract-agent-secret
  - it: "bedrock provides the configured extract agent secret to the download worker"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      extract.enabled: true
      extract.agent.enabled: true
      extract.agent.apiBaseUrl: https://bedrock-mantle.us-west-2.api.aws/openai/v1
      extract.agent.existingSecret: true
      extract.agent.modelId: google.gemma-4-31b
      extract.agent.serviceType: bedrock
      extract.download.enabled: true
      extract.file.bucketName: configured-bucket
      extract.file.region: us-west-2
      extract.file.serviceType: s3
      extract.file.url: https://configured-bucket.s3.us-west-2.amazonaws.com
    documentSelector:
      path: metadata.name
      value: extract-download
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: extract-agent-secret
  - it: "bedrock provides the configured extract agent secret to the save worker"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      extract.enabled: true
      extract.agent.enabled: true
      extract.agent.apiBaseUrl: https://bedrock-mantle.us-west-2.api.aws/openai/v1
      extract.agent.existingSecret: true
      extract.agent.modelId: google.gemma-4-31b
      extract.agent.serviceType: bedrock
      extract.file.bucketName: configured-bucket
      extract.file.region: us-west-2
      extract.file.serviceType: s3
      extract.file.url: https://configured-bucket.s3.us-west-2.amazonaws.com
      extract.save.enabled: true
    documentSelector:
      path: metadata.name
      value: extract-save
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: extract-agent-secret
  - it: "extract config uses the same custom queues as its workers"
    templates:
      - ../templates/resources/extract-config-py.yaml
    values:
      - ../values/extract/values.yaml
    set:
      extract.agent.queue: custom_agent_queue
      extract.download.queue: custom_download_queue
      extract.save.queue: custom_save_queue
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'agent_queue = "custom_agent_queue"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'download_queue = "custom_download_queue"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'save_queue = "custom_save_queue"'
  - it: "extract config renders nested model kwargs as Python objects"
    templates:
      - ../templates/resources/extract-config-py.yaml
    values:
      - ../values/extract/values.yaml
    set:
      extract.agent.model.kwargs.client_kwargs.max_retries: 1
      extract.agent.model.kwargs.client_kwargs.timeout: 180
      extract.agent.model.kwargs.extra_body.parallel_tool_calls: false
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: '"client_kwargs": \{[^}]*"max_retries": 1'
      - matchRegex:
          path: stringData["config.py"]
          pattern: '"client_kwargs": \{[^}]*"timeout": 180'
      - matchRegex:
          path: stringData["config.py"]
          pattern: '"extra_body": \{[^}]*"parallel_tool_calls": False'
  - it: "extract-agent hpa keeps a safer default minimum"
    templates:
      - ../templates/resources/hpa.yaml
    set:
      cluster.hpa: true
    values:
      - ../values/extract/values.yaml
    documentSelector:
      path: metadata.name
      value: extract-agent-hpa
    asserts:
      - equal:
          path: spec.minReplicas
          value: 2
