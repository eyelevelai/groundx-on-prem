apiVersion: apps/v1
kind: Deployment
metadata:
  name: layout-api
spec:
  template:
    spec:
      containers:
        - name: layout-api
          image: eyelevel/python-api:0.2.7
          livenessProbe:
            timeoutSeconds: 3
          readinessProbe:
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranker-api
spec:
  template:
    spec:
      containers:
        - name: ranker-api
          image: eyelevel/ranker-api:0.2.7
          livenessProbe:
            timeoutSeconds: 3
          readinessProbe:
            timeoutSeconds: 3
            failureThreshold: 3
