summaryBillDeliver:
  enabled: true
  image: test.invalid/summary-bill-delivery:local
  concurrency: 2
  maxUploadDuration: 30s
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 256Mi
  counting:
    maxPDFBytes: 1048576
    maxCountDuration: 10s
    helperPath: /app/summary-bill-pdf-count
    tempDir: /tmp
  credentials:
    operations-drive:
      secretName: summary-bill-drive
      secretKey: service-account.json
