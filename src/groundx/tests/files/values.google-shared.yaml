# Combines the two consumers without changing the existing single-service fixtures.
# The full gate generates this fake credential file and removes it on exit.
google:
  credentials: files/ocr/gcv-test.json
layout:
  ocr:
    enabled: true
    type: google
    project: test-project
largeFileDeliver:
  enabled: true
  image: test.invalid/large-file-delivery:local
  concurrency: 2
  maxUploadDuration: 30s
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 256Mi
  counting:
    maxCountDuration: 10s
    tempDir: /tmp
  credentials:
    operations-drive:
      sharedGoogle: true
