suite: "OpenSearch Secret-backed credential path (GX-17)"

tests:
  - it: "existingSecret set, plaintext empty: SEARCH_* envFrom rendered and plaintext omitted from config-yaml"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      groundx.enabled: true
      search.existingSecret: true
      search.username: ""
      search.password: ""
      search.privilegedUsername: ""
      search.privilegedPassword: ""
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: opensearch-secret
  - it: "existingSecret set, plaintext empty: config-yaml omits the OpenSearch username/password keys"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      groundx.enabled: true
      search.existingSecret: true
      search.username: ""
      search.password: ""
      search.privilegedUsername: ""
      search.privilegedPassword: ""
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "(?s)ai:\\n(?:.*\\n)*?\\s+search:\\n(?:\\s+.*\\n)*?\\s+password:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "(?s)ai:\\n(?:.*\\n)*?\\s+search:\\n(?:\\s+.*\\n)*?\\s+username:"
  - it: "catches: existingSecret set but plaintext also set - config wins, plaintext still renders"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      groundx.enabled: true
      search.existingSecret: true
      search.password: test-search-password
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "password: \"test-search-password\""
  - it: "must not block: default install has no opensearch-secret Secret and no SEARCH_* envFrom"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/secret.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      groundx.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom
        template: ../templates/app/golang.yaml
        documentIndex: 0
      - hasDocuments:
          count: 0
        template: ../templates/resources/secret.yaml
