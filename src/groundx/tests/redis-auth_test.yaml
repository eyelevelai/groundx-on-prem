suite: "authenticated Redis credentials render per identity (GX-24)"
chart:
  appVersion: 0.1.0
  version: 0.1.0

tests:
  - it: "no credential configured: config-yaml.yaml session blocks are unchanged from 0.2.7"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "session:\\n    addr: cache\\.eyelevel\\.svc\\.cluster\\.local:6379\\n    notCluster: true\\n    ssl: false\\n\\n"
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "session:\\n    addr: cache-metrics\\.eyelevel\\.svc\\.cluster\\.local:6379\\n    notCluster: true\\n    ssl: false\\n  summaryRequest:"

  - it: "cashbot-go rec.session and metrics.session render their own credential (ACL user+password vs password-only)"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values/values.existing.yaml
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "session:\\n    addr: cache\\.existing\\.com:6379\\n    notCluster: true\\n    ssl: true\\n    username: \"cache-acl-user\"\\n    password: \"cache-p@ss:w0rd\"\\n\\n"
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "session:\\n    addr: metrics-cache\\.existing\\.com:6379\\n    notCluster: true\\n    ssl: true\\n    password: \"metrics-p@ss:w0rd\"\\n  summaryRequest:"

  - it: "layout/summary/extract Celery broker and result URLs embed the main and metrics credentials, percent-encoded"
    templates:
      - ../templates/resources/layout-config-py.yaml
      - ../templates/resources/summary-config-py.yaml
      - ../templates/resources/extract-config-py.yaml
    values:
      - ../values/values.existing.yaml
    set:
      summary.existing.serviceType: ""
      extract.enabled: true
      extract.api.enabled: true
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'layoutBroker="rediss://cache-acl-user:cache-p%40ss%3Aw0rd@cache\.existing\.com:6379/0"'
        template: ../templates/resources/layout-config-py.yaml
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'layoutResultBroker="rediss://cache-acl-user:cache-p%40ss%3Aw0rd@cache\.existing\.com:6379/0"'
        template: ../templates/resources/layout-config-py.yaml
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'metricsBroker="rediss://metrics-p%40ss%3Aw0rd@metrics-cache\.existing\.com:6379/0"'
        template: ../templates/resources/layout-config-py.yaml
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'summaryBroker="rediss://cache-acl-user:cache-p%40ss%3Aw0rd@cache\.existing\.com:6379/0"'
        template: ../templates/resources/summary-config-py.yaml
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'summaryResultBroker="rediss://cache-acl-user:cache-p%40ss%3Aw0rd@cache\.existing\.com:6379/0"'
        template: ../templates/resources/summary-config-py.yaml
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'metricsBroker="rediss://metrics-p%40ss%3Aw0rd@metrics-cache\.existing\.com:6379/0"'
        template: ../templates/resources/summary-config-py.yaml
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'broker="rediss://cache-acl-user:cache-p%40ss%3Aw0rd@cache\.existing\.com:6379/0"'
        template: ../templates/resources/extract-config-py.yaml
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'metrics_broker="rediss://metrics-p%40ss%3Aw0rd@metrics-cache\.existing\.com:6379/0"'
        template: ../templates/resources/extract-config-py.yaml

  - it: "ranker with no own instance inherits the main cache's credential"
    templates:
      - ../templates/resources/ranker-config-py.yaml
    values:
      - ../values/values.existing.yaml
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'searchBroker="rediss://cache-acl-user:cache-p%40ss%3Aw0rd@cache\.existing\.com:6379/0"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'searchResultBroker="rediss://cache-acl-user:cache-p%40ss%3Aw0rd@cache\.existing\.com:6379/0"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'metricsBroker="rediss://metrics-p%40ss%3Aw0rd@metrics-cache\.existing\.com:6379/0"'

  - it: "ranker with its own instance gets its own credential, never the main cache's (mechanical-sweep counterexample)"
    templates:
      - ../templates/resources/ranker-config-py.yaml
    values:
      - ../values/values.existing.yaml
    set:
      ranker.cache.addr: ranker-cache.other.net
      ranker.cache.port: 6380
      ranker.cache.password: ranker-only-p@ss
      ranker.cache.username: ranker-only-user
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'searchBroker="redis://ranker-only-user:ranker-only-p%40ss@ranker-cache\.other\.net:6380/0"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'searchResultBroker="redis://ranker-only-user:ranker-only-p%40ss@ranker-cache\.other\.net:6380/0"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'metricsBroker="rediss://metrics-p%40ss%3Aw0rd@metrics-cache\.existing\.com:6379/0"'
      - notMatchRegex:
          path: stringData["config.py"]
          pattern: "cache-acl-user"
      - notMatchRegex:
          path: stringData["config.py"]
          pattern: "cache-p%40ss%3Aw0rd"

  - it: "workspace's fallback Celery URL carries the main cache credential"
    templates:
      - ../templates/resources/workspace-config-py.yaml
    values:
      - ../values/values.existing.yaml
    set:
      workspace.enabled: true
      workspace.token: test-runner-token
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'celery_broker_url="rediss://cache-acl-user:cache-p%40ss%3Aw0rd@cache\.existing\.com:6379/0"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'celery_result_backend="rediss://cache-acl-user:cache-p%40ss%3Aw0rd@cache\.existing\.com:6379/0"'

  - it: "a credential containing a space percent-encodes to %20 (never urlquery's literal '+'), for every identity"
    templates:
      - ../templates/resources/layout-config-py.yaml
      - ../templates/resources/ranker-config-py.yaml
    values:
      - ../values.yaml
    set:
      cache.password: "has space"
      cache.metrics.password: "metrics has space"
      ranker.cache.addr: ranker-cache.other.net
      ranker.cache.username: ranker-user
      ranker.cache.password: "ranker has space"
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'layoutBroker="redis://has%20space@cache\.eyelevel\.svc\.cluster\.local:6379/0"'
        template: ../templates/resources/layout-config-py.yaml
      - notMatchRegex:
          path: stringData["config.py"]
          pattern: "has\\+space"
        template: ../templates/resources/layout-config-py.yaml
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'metricsBroker="redis://metrics%20has%20space@cache-metrics\.eyelevel\.svc\.cluster\.local:6379/0"'
        template: ../templates/resources/layout-config-py.yaml
      - notMatchRegex:
          path: stringData["config.py"]
          pattern: "metrics\\+has\\+space"
        template: ../templates/resources/layout-config-py.yaml
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'searchBroker="redis://ranker-user:ranker%20has%20space@ranker-cache\.other\.net:6379/0"'
        template: ../templates/resources/ranker-config-py.yaml
      - notMatchRegex:
          path: stringData["config.py"]
          pattern: "ranker\\+has\\+space"
        template: ../templates/resources/ranker-config-py.yaml

  - it: "workspace's operator-supplied Celery URL is never rewritten with an injected credential"
    templates:
      - ../templates/resources/workspace-config-py.yaml
    values:
      - ../values/values.existing.yaml
    set:
      workspace.enabled: true
      workspace.token: test-runner-token
      workspace.celeryBrokerUrl: "rediss://custom-op:custom-secret@other-redis.mycorp.net:6379/2"
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'celery_broker_url="rediss://custom-op:custom-secret@other-redis\.mycorp\.net:6379/2"'
      - notMatchRegex:
          path: stringData["config.py"]
          pattern: "cache-acl-user"
