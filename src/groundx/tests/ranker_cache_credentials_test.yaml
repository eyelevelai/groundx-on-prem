suite: "GX-24: ranker cache identity renders AUTH credentials"
chart:
  appVersion: 0.1.0
  version: 0.1.0

tests:
  - it: "schema accepts ranker.cache.password / ranker.cache.username (flat, no existing sub-object)"
    templates:
      - ../templates/resources/ranker-config-py.yaml
    values:
      - ../values.yaml
    set:
      ranker.cache.addr: ranker-cache.existing.com
      ranker.cache.password: rankerpass
      ranker.cache.username: rankeruser
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'searchBroker="redis://rankeruser:rankerpass@ranker-cache\.existing\.com:6379/0"'

  - it: "an identity with no credential of its own inherits the main cache credential"
    templates:
      - ../templates/resources/ranker-config-py.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.enabled: false
      cache.existing.addr: cache.existing.com
      cache.password: mainsharedpass
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'searchBroker="redis://:mainsharedpass@cache\.existing\.com:6379/0"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'searchResultBroker="redis://:mainsharedpass@cache\.existing\.com:6379/0"'

  - it: "an identity's own credential overrides the inherited main cache credential"
    templates:
      - ../templates/resources/ranker-config-py.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.enabled: false
      cache.existing.addr: cache.existing.com
      cache.password: mainpass
      ranker.cache.addr: ranker-cache.existing.com
      ranker.cache.password: rankerownpass
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'searchBroker="redis://:rankerownpass@ranker-cache\.existing\.com:6379/0"'
      - notMatchRegex:
          path: stringData["config.py"]
          pattern: 'searchBroker="redis://:mainpass@'

  - it: "an identity with its own external addr but no own credential renders NO credential - it must not inherit a main credential meant for a different host (F1)"
    templates:
      - ../templates/resources/ranker-config-py.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.enabled: false
      cache.existing.addr: cache.existing.com
      cache.password: mainpass
      ranker.cache.addr: ranker-cache.existing.com
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'searchBroker="redis://ranker-cache\.existing\.com:6379/0"'
      - notMatchRegex:
          path: stringData["config.py"]
          pattern: 'searchBroker="redis://[^"]*mainpass'

  - it: "a credential on the ranker identity falling back to the chart's bundled main cache fails the render loudly (F13 re-confirmed: still fails, since a ranker own-value with no addr and a non-external main resolves to the ranker's own value, which is exactly the state validateCredentials rejects)"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    set:
      ranker.cache.password: rankerpass
    asserts:
      - failedTemplate:
          errorMessage: "ranker.cache.password/ranker.cache.username require an external Redis (ranker.cache.addr) or an external main cache; the chart's own bundled Redis has no AUTH support"

  - it: "ranker.cache.password set with no ranker.cache.addr must not leak its own value into an external main cache's connection - the resolved credential is the main cache's own credential, never the ranker's stale own value (F13 repro for ranker: groundx.ranker.cache.password/.username previously coalesced an own value ahead of the main cache's, even in the not-existing branch where the address unconditionally resolves to the main cache - a credential/address source mismatch whenever the main cache was external. Fixed: the not-existing branch now uses the main cache's credential whenever the main cache is external - matching the address source exactly - and only falls back to ranker's own value when the main cache is not external, which is what keeps the case above reachable and fail-loud)"
    templates:
      - ../templates/resources/ranker-config-py.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.enabled: false
      cache.existing.addr: cache.existing.com
      cache.password: mainpass
      ranker.cache.password: rankerwrongpass
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'searchBroker="redis://:mainpass@cache\.existing\.com:6379/0"'
      - notMatchRegex:
          path: stringData["config.py"]
          pattern: 'searchBroker="redis://[^"]*rankerwrongpass'

  - it: "a ranker credential is not blocked when ranker has its own external addr"
    templates:
      - ../templates/resources/ranker-config-py.yaml
    values:
      - ../values.yaml
    set:
      ranker.cache.addr: ranker-cache.existing.com
      ranker.cache.password: rankerpass
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'searchBroker="redis://:rankerpass@ranker-cache\.existing\.com:6379/0"'

  - it: "a ranker credential is not blocked when it falls back to an external main cache"
    templates:
      - ../templates/resources/ranker-config-py.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.enabled: false
      cache.existing.addr: cache.existing.com
      cache.password: mainpass
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'searchBroker="redis://:mainpass@cache\.existing\.com:6379/0"'

  - it: "a username with no password on ranker's own external Redis is rejected - nopass ACL is unsupported (decision a)"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    set:
      ranker.cache.addr: ranker-cache.existing.com
      ranker.cache.username: rankeruser
    asserts:
      - failedTemplate:
          errorMessage: "ranker.cache.username requires ranker.cache.password to also be set; a username with no password (nopass ACL) is not supported"

  - it: "default values (no credential set) render searchBroker/searchResultBroker unchanged"
    templates:
      - ../templates/resources/ranker-config-py.yaml
    values:
      - ../values.yaml
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'searchBroker="redis://cache\.eyelevel\.svc\.cluster\.local:6379/0"'
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'searchResultBroker="redis://cache\.eyelevel\.svc\.cluster\.local:6379/0"'
