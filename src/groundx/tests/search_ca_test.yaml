suite: "GroundX trusts the in-cluster OpenSearch through opensearch-tls"
chart:
  appVersion: 0.1.0
  version: 0.1.0

set:
  search:
    password: fixture-app-credential
    privilegedPassword: fixture-admin-credential

tests:
  - it: renders caFile in the search block for the in-cluster OpenSearch
    templates:
      - ../templates/resources/config-yaml.yaml
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'search:\n\s+baseURL: [^\n]+\n\s+caFile: /var/run/groundx/search-ca/ca\.crt\n'
  - it: mounts only ca.crt from opensearch-tls read-only into groundx
    templates:
      - ../templates/app/golang.yaml
    documentSelector:
      path: spec.template.metadata.labels.app
      value: groundx
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: search-ca
            secret:
              secretName: opensearch-tls
              items:
                - key: ca.crt
                  path: ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: search-ca
            mountPath: /var/run/groundx/search-ca
            readOnly: true
  - it: uses search.caSecretName instead of opensearch-tls when it is set
    templates:
      - ../templates/app/golang.yaml
    set:
      search.caSecretName: fixture-search-ca
    documentSelector:
      path: spec.template.metadata.labels.app
      value: groundx
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: search-ca
            secret:
              secretName: fixture-search-ca
              items:
                - key: ca.crt
                  path: ca.crt
  - it: mounts no search CA and renders no caFile for an existing OpenSearch
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    set:
      search.existing.url: https://search.test.invalid:9200
    asserts:
      - notExists:
          path: 'spec.template.spec.volumes[?(@.name == "search-ca")]'
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.template.metadata.labels.app
          value: groundx
      - notMatchRegex:
          path: stringData["config.yaml"]
          pattern: 'caFile:'
        template: ../templates/resources/config-yaml.yaml
