suite: large file delivery
chart:
  appVersion: 0.1.0
  version: 0.1.0
tests:
  - it: creates the enabled worker with bounded concurrency and mounted credentials
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.large-file.yaml
    documentSelector:
      path: metadata.name
      value: large-file-delivery
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: test.invalid/large-file-delivery:local
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: large-file-credential-0
            mountPath: /var/run/groundx/large-file/operations-drive
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: large-file-credential-0
            secret:
              secretName: large-file-drive
              items:
                - key: service-account.json
                  path: credentials.json
  - it: emits the same delivery topic and credential path for Go workers
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.large-file.yaml
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'largeFile:\n\s+broker:.*\n\s+groupId: large-file\n\s+topic: large-file\n\s+type: kafka'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'credentialsFile: /var/run/groundx/large-file/operations-drive/credentials.json'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'largeFileDeliveryServer:'
  - it: omits optional delivery configuration when explicitly disabled
    templates:
      - ../templates/resources/config-yaml.yaml
    set:
      largeFileDeliver.enabled: false
    asserts:
      - notMatchRegex:
          path: stringData["config.yaml"]
          pattern: 'largeFile|large-file'
  - it: creates a Kafka delivery topic with the requested worker partition count
    templates:
      - ../templates/services/stream-topics.yaml
    values:
      - ./files/values.large-file.yaml
    set:
      largeFileDeliver.replicas.desired: 3
    documentSelector:
      path: metadata.name
      value: large-file
    asserts:
      - isKind:
          of: KafkaTopic
      - equal:
          path: spec.partitions
          value: 3
  - it: uses the external SQS queue
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.large-file.yaml
    set:
      stream.topics.largeFile.type: sqs
      stream.topics.largeFile.url: https://sqs.us-west-2.amazonaws.com/123456789012/large-file
      stream.topics.largeFile.region: us-west-2
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'largeFile:\n\s+region: us-west-2\n\s+type: sqs\n\s+url: https://sqs.us-west-2.amazonaws.com/123456789012/large-file'
  - it: creates no additional Kafka topic for SQS delivery
    templates:
      - ../templates/services/stream-topics.yaml
    values:
      - ./files/values.large-file.yaml
    set:
      stream.topics.largeFile.type: sqs
      stream.topics.largeFile.url: https://sqs.us-west-2.amazonaws.com/123456789012/large-file
    asserts:
      - hasDocuments:
          count: 5
  - it: mounts no Drive credentials in the producer
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.large-file.yaml
    documentSelector:
      path: metadata.name
      value: queue
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 1
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1
