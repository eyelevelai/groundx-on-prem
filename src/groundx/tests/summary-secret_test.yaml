suite: "Summary API key Secret-backed path, mirroring extract.agent (GX-17)"

tests:
  - it: "existingSecret set, apiKey empty: groundx pod gets summary-secret envFrom, chart creates nothing"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/secret.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      groundx.enabled: true
      summary.existing.existingSecret: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: summary-secret
        template: ../templates/app/golang.yaml
        documentIndex: 0
      - hasDocuments:
          count: 0
        template: ../templates/resources/secret.yaml
  - it: "plaintext path: apiKey set, existingSecret unset - literal renders and chart creates the secret (dev path, mirrors extract.agent)"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
      - ../templates/resources/secret.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      groundx.enabled: true
      summary.existing.apiKey: test-summary-key
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "apiKey: test-summary-key"
        template: ../templates/resources/config-yaml.yaml
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: summary-secret
        template: ../templates/app/golang.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: summary-secret
        template: ../templates/resources/secret.yaml
      - matchRegex:
          path: data["GROUNDX_SUMMARY_API_KEY"]
          pattern: ".+"
        template: ../templates/resources/secret.yaml
        decodeBase64: true
  - it: "must not block: neither apiKey nor existingSecret set - no summary secret or envFrom appears"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/secret.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      groundx.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom
        template: ../templates/app/golang.yaml
        documentIndex: 0
      - hasDocuments:
          count: 0
        template: ../templates/resources/secret.yaml
