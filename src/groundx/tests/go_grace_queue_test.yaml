suite: "queue services share the Go shutdown rule"
chart:
  appVersion: 0.1.0
  version: 0.1.0

set:
  search:
    password: fixture-app-credential
    privilegedPassword: fixture-admin-credential

tests:
  - it: "all seven queue services render 900 and 870 by default"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.large-file.yaml
      - ./files/values.post-process.yaml
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: large-file-delivery
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: post-process
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: process
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "largeFileDeliveryServer:\n  drainSeconds: 870\n  maxConcurrent: "
        template: ../templates/resources/config-yaml.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "postProcessFileServer:\n  drainSeconds: 870\n  maxConcurrent: "
        template: ../templates/resources/config-yaml.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "uploadFileServer:\n  baseURL: .*\n  drainSeconds: 870\n"
        template: ../templates/resources/config-yaml.yaml
  - it: "largeFileDeliver.replicas.gracePeriod changes large-file-delivery only"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.large-file.yaml
      - ./files/values.post-process.yaml
    set:
      largeFileDeliver.replicas.gracePeriod: 120
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 120
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: large-file-delivery
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: post-process
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "largeFileDeliveryServer:\n  drainSeconds: 90\n"
        template: ../templates/resources/config-yaml.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "postProcessFileServer:\n  drainSeconds: 870\n"
        template: ../templates/resources/config-yaml.yaml
  - it: "postProcess.replicas.gracePeriod changes post-process only"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.large-file.yaml
      - ./files/values.post-process.yaml
    set:
      postProcess.replicas.gracePeriod: 200
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 200
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: post-process
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: large-file-delivery
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "postProcessFileServer:\n  drainSeconds: 170\n"
        template: ../templates/resources/config-yaml.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "largeFileDeliveryServer:\n  drainSeconds: 870\n"
        template: ../templates/resources/config-yaml.yaml
  - it: "an override on one of the five existing queue services leaves the other six on the default"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.large-file.yaml
      - ./files/values.post-process.yaml
    set:
      upload.replicas.gracePeriod: 180
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 180
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: upload
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: large-file-delivery
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "uploadFileServer:\n  baseURL: .*\n  drainSeconds: 150\n"
        template: ../templates/resources/config-yaml.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "largeFileDeliveryServer:\n  drainSeconds: 870\n"
        template: ../templates/resources/config-yaml.yaml
  - it: "largeFileDeliver gracePeriod of zero is rejected before anything renders"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.large-file.yaml
    set:
      largeFileDeliver.replicas.gracePeriod: 0
    asserts:
      - failedTemplate:
          errorPattern: "largeFileDeliver/replicas/gracePeriod.*minimum: got 0, want 1"
  - it: "postProcess gracePeriod that is not an integer is rejected before anything renders"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ./files/values.post-process.yaml
    set:
      postProcess.replicas.gracePeriod: "soon"
    asserts:
      - failedTemplate:
          errorPattern: "postProcess/replicas/gracePeriod"
  - it: "a bare largeFileDeliver.replicas.gracePeriod renders without setting desired"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.large-file.yaml
    set:
      largeFileDeliver.replicas.gracePeriod: 120
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 120
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: large-file-delivery
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "largeFileDeliveryServer:\n  drainSeconds: 90\n"
        template: ../templates/resources/config-yaml.yaml
  - it: "a bare postProcess.replicas.gracePeriod renders without setting desired"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ./files/values.post-process.yaml
    set:
      postProcess.replicas.gracePeriod: 200
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 200
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: post-process
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "postProcessFileServer:\n  drainSeconds: 170\n"
        template: ../templates/resources/config-yaml.yaml
