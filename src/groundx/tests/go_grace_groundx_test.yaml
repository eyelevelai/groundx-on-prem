suite: "groundx pod and config share the Go shutdown rule"
chart:
  appVersion: 0.1.0
  version: 0.1.0

set:
  search:
    password: fixture-app-credential
    privilegedPassword: fixture-admin-credential

tests:
  - it: "groundx pod renders the 150-second default when no gracePeriod is set"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    documentSelector:
      path: spec.selector.matchLabels.app
      value: groundx
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 150
  - it: "groundxServer block renders drainSeconds 120 when no gracePeriod is set"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values/minikube/values.yaml
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "groundxServer:\n  baseURL: .*\n  drainSeconds: 120\n  port: "
  - it: "groundx.replicas.gracePeriod overrides the pod and the block for groundx only"
    templates:
      - ../templates/app/golang.yaml
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      groundx.replicas.gracePeriod: 300
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 300
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: groundx
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 150
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: layout-webhook
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 900
        template: ../templates/app/golang.yaml
        documentSelector:
          path: spec.selector.matchLabels.app
          value: process
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "groundxServer:\n  baseURL: .*\n  drainSeconds: 270\n"
        template: ../templates/resources/config-yaml.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "layoutWebhookServer:\n  baseURL: .*\n  drainSeconds: 120\n"
        template: ../templates/resources/config-yaml.yaml
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "processFileServer:\n  baseURL: .*\n  drainSeconds: 870\n"
        template: ../templates/resources/config-yaml.yaml
  - it: "groundx gracePeriod under 31 floors drainSeconds at 1"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      groundx.replicas.gracePeriod: 20
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "groundxServer:\n  baseURL: .*\n  drainSeconds: 1\n"
  - it: "groundx gracePeriod of zero is rejected before anything renders"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      groundx.replicas.gracePeriod: 0
    asserts:
      - failedTemplate:
          errorPattern: "groundx/replicas/gracePeriod.*minimum: got 0, want 1"
  - it: "groundx gracePeriod that is not an integer is rejected before anything renders"
    templates:
      - ../templates/app/golang.yaml
    values:
      - ../values/minikube/values.yaml
    set:
      groundx.replicas.gracePeriod: "soon"
    asserts:
      - failedTemplate:
          errorPattern: "groundx/replicas/gracePeriod.*(got string, want integer|type)"
