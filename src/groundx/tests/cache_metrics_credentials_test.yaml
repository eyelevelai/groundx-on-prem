suite: "GX-24: metrics cache identity renders AUTH credentials"
chart:
  appVersion: 0.1.0
  version: 0.1.0

tests:
  - it: "schema accepts cache.metrics.password / cache.metrics.username (top-level of the metrics block)"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.existing.addr: metrics-cache.existing.com
      cache.metrics.password: metricspass
      cache.metrics.username: metricsuser
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'username: "metricsuser"'

  - it: "schema accepts cache.metrics.existing.password / cache.metrics.existing.username"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.existing.addr: metrics-cache.existing.com
      cache.metrics.existing.password: metricspass
      cache.metrics.existing.username: metricsuser
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'username: "metricsuser"'

  - it: "cashbot-go metrics.session block renders the raw, unencoded metrics credential"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.existing.addr: metrics-cache.existing.com
      cache.metrics.existing.password: "m@trics:pass"
      cache.metrics.existing.username: metricsuser
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'session:\n    addr: metrics-cache\.existing\.com:6379\n    notCluster: .*\n    password: "m@trics:pass"\n    ssl: .*\n    username: "metricsuser"\n'

  - it: "an identity with no credential of its own inherits the main cache credential (metrics disabled, proxies main cache)"
    templates:
      - ../templates/resources/layout-config-py.yaml
      - ../templates/resources/ranker-config-py.yaml
      - ../templates/resources/summary-config-py.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.enabled: false
      cache.existing.addr: cache.existing.com
      cache.password: mainsharedpass
    asserts:
      - matchRegex:
          template: ../templates/resources/layout-config-py.yaml
          path: stringData["config.py"]
          pattern: 'metricsBroker="redis://:mainsharedpass@cache\.existing\.com:6379/0"'
      - matchRegex:
          template: ../templates/resources/ranker-config-py.yaml
          path: stringData["config.py"]
          pattern: 'metricsBroker="redis://:mainsharedpass@cache\.existing\.com:6379/0"'
      - matchRegex:
          template: ../templates/resources/summary-config-py.yaml
          path: stringData["config.py"]
          pattern: 'metricsBroker="redis://:mainsharedpass@cache\.existing\.com:6379/0"'

  - it: "an identity's own credential overrides the inherited main cache credential"
    templates:
      - ../templates/resources/layout-config-py.yaml
    values:
      - ../values.yaml
    set:
      cache.existing.addr: cache.existing.com
      cache.password: mainpass
      cache.metrics.enabled: true
      cache.metrics.existing.addr: metrics-cache.existing.com
      cache.metrics.existing.password: metricsownpass
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'metricsBroker="redis://:metricsownpass@metrics-cache\.existing\.com:6379/0"'
      - notMatchRegex:
          path: stringData["config.py"]
          pattern: 'metricsBroker="redis://:mainpass@'

  - it: "an identity with its own external addr but no own credential renders NO credential - it must not inherit a main credential meant for a different host (F1)"
    templates:
      - ../templates/resources/layout-config-py.yaml
    values:
      - ../values.yaml
    set:
      cache.existing.addr: cache.existing.com
      cache.password: mainpass
      cache.metrics.enabled: true
      cache.metrics.existing.addr: metrics-cache.existing.com
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'metricsBroker="redis://metrics-cache\.existing\.com:6379/0"'
      - notMatchRegex:
          path: stringData["config.py"]
          pattern: 'metricsBroker="redis://:mainpass@'
      - notMatchRegex:
          path: stringData["config.py"]
          pattern: 'metricsBroker="redis://[^"]*mainpass'

  - it: "a credential on the metrics identity's own bundled instance fails the render loudly, even when the main cache is external (F4 vacuous-test fix)"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    set:
      cache.existing.addr: cache.existing.com
      cache.metrics.password: metricspass
    asserts:
      - failedTemplate:
          errorMessage: "cache.metrics.password/cache.metrics.username require an external Redis (cache.metrics.existing.addr) or an external main cache; the chart's own bundled Redis has no AUTH support"

  - it: "an external main cache with a bundled (default-enabled) metrics identity does not inherit the main credential - it renders unauthenticated at its own bundled pod (F13 aligned-predicate fix supersedes the round-1 F4 bug (ii) fail-loud: credential resolution now gates on cache.metrics.enabled, the same variable groundx.metrics.cache.addr already uses, so an enabled bundled metrics identity's address AND credential both resolve from its own - empty - state, never from the external main)"
    templates:
      - ../templates/resources/layout-config-py.yaml
    values:
      - ../values.yaml
    set:
      cache.existing.addr: cache.existing.com
      cache.password: mainpass
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'metricsBroker="redis://cache-metrics\.eyelevel\.svc\.cluster\.local:6379/0"'
      - notMatchRegex:
          path: stringData["config.py"]
          pattern: 'metricsBroker="redis://[^"]*mainpass'

  - it: "cache.metrics.enabled=false with cache.metrics.existing.addr/password still set and an external main cache: the metrics identity fully collapses onto the main identity - address AND credential both resolve from main, never a mix of the two (F13 repro: the credential helpers previously gated on metrics.existing.addr presence while the addr helper gated on metrics.enabled, so a disabled metrics block with a stale existing.addr/password rendered the MAIN host with the METRICS password)"
    templates:
      - ../templates/resources/layout-config-py.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.enabled: false
      cache.metrics.existing.addr: metrics-cache.existing.com
      cache.metrics.existing.password: metricspass
      cache.existing.addr: cache.existing.com
      cache.password: mainpass
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'metricsBroker="redis://:mainpass@cache\.existing\.com:6379/0"'
      - notMatchRegex:
          path: stringData["config.py"]
          pattern: 'metricsBroker="redis://[^"]*metrics-cache\.existing\.com'
      - notMatchRegex:
          path: stringData["config.py"]
          pattern: 'metricsBroker="redis://[^"]*metricspass'

  - it: "a metrics credential is not blocked when the metrics identity is its own external Redis"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.existing.addr: metrics-cache.existing.com
      cache.metrics.existing.password: metricspass
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'password: "metricspass"'

  - it: "a username with no password on the metrics identity's own external Redis is rejected - nopass ACL is unsupported (decision a)"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.existing.addr: metrics-cache.existing.com
      cache.metrics.existing.username: metricsuser
    asserts:
      - failedTemplate:
          errorMessage: "cache.metrics.username requires cache.metrics.password to also be set; a username with no password (nopass ACL) is not supported"

  - it: "default values (no credential set) render metricsBroker unchanged"
    templates:
      - ../templates/resources/layout-config-py.yaml
    values:
      - ../values.yaml
    asserts:
      - matchRegex:
          path: stringData["config.py"]
          pattern: 'metricsBroker="redis://cache-metrics\.eyelevel\.svc\.cluster\.local:6379/0"'
