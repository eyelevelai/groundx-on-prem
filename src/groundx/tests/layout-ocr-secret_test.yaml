suite: "Google OCR credential Secret-volume path, additive to the packaged file (GX-17)"

tests:
  - it: "existingSecret set: layout-ocr mounts a Secret volume at /app/credentials.json"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      layout.ocr.enabled: true
      layout.ocr.existingSecret: true
    documentSelector:
      path: metadata.name
      value: layout-ocr
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: credentials-secret-volume
            secret:
              secretName: layout-ocr-secret
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: credentials-secret-volume
            mountPath: /app/credentials.json
            subPath: credentials.json
  - it: "packaged-file path unchanged: the existing file-not-found validation is untouched by this change"
    templates:
      - ../templates/resources/layout-ocr-credentials.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      layout.ocr.enabled: true
      layout.ocr.credentials: files/ocr/credentials.json
    asserts:
      - failedTemplate:
          errorMessage: "layout.ocr.credentials file not found at path: files/ocr/credentials.json"
  - it: "catches: setting both credentials and existingSecret fails the render instead of a duplicate mountPath"
    templates:
      - ../templates/app/celery.yaml
      - ../templates/resources/layout-supervisord-conf.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      layout.ocr.enabled: true
      layout.ocr.credentials: files/ocr/credentials.json
      layout.ocr.existingSecret: true
    asserts:
      - failedTemplate:
          errorMessage: "layout.ocr.credentials and layout.ocr.existingSecret are mutually exclusive"
        template: ../templates/resources/layout-supervisord-conf.yaml
  - it: "must not block: OCR disabled by default has no credentials volume of either kind"
    templates:
      - ../templates/app/celery.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      layout.ocr.enabled: true
    documentSelector:
      path: metadata.name
      value: layout-ocr
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: credentials-secret-volume
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: credentials-volume
