suite: "extract api agent key precedence"
chart:
  appVersion: 0.1.0
  version: 0.1.0

set:
  search:
    password: fixture-app-credential
    privilegedPassword: fixture-admin-credential

tests:
  - it: "extract-api renders the agent Secret last with shared Secrets sorting before and after it, listed shared first"
    templates:
      - ../templates/app/api.yaml
    values:
      - ./files/values.disabled.yaml
      - ./files/values.agent-key-shared-first.yaml
    set:
      admin.apiKey: summary-key
      extract.enabled: true
      extract.agent.enabled: true
      extract.api.enabled: true
      extract.download.enabled: true
      extract.save.enabled: true
    documentSelector:
      path: spec.template.metadata.labels.app
      value: extract-api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: aaa-conflict
            - secretRef:
                name: extract-save-secret
            - secretRef:
                name: eyelevel-secret-credentials
            - secretRef:
                name: zzz-conflict
            - secretRef:
                name: extract-agent-secret
  - it: "extract-api renders the agent Secret last with shared Secrets sorting before and after it, listed shared last"
    templates:
      - ../templates/app/api.yaml
    values:
      - ./files/values.disabled.yaml
      - ./files/values.agent-key-shared-last.yaml
    set:
      admin.apiKey: summary-key
      extract.enabled: true
      extract.agent.enabled: true
      extract.api.enabled: true
      extract.download.enabled: true
      extract.save.enabled: true
    documentSelector:
      path: spec.template.metadata.labels.app
      value: extract-api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: aaa-conflict
            - secretRef:
                name: extract-save-secret
            - secretRef:
                name: eyelevel-secret-credentials
            - secretRef:
                name: zzz-conflict
            - secretRef:
                name: extract-agent-secret
