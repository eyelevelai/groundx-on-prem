suite: "metrics renders as expected"
chart:
  appVersion: 0.1.0
  version: 0.1.0

set:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
    useExisting: true

tests:
  - it: "default: golang"
    templates:
      - ../templates/app/metrics.yaml
    values:
      - ../values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "empty: golang"
    templates:
      - ../templates/app/metrics.yaml
    values:
      - ./files/values.empty.yaml
    asserts:
      - matchSnapshot: {}
  - it: "aws: golang"
    templates:
      - ../templates/app/metrics.yaml
    values:
      - ../values/values.aws.services.yaml
    asserts:
      - matchSnapshot: {}
  - it: "openshift: golang"
    templates:
      - ../templates/app/metrics.yaml
    values:
      - ../values/openshift/values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "minikube: golang"
    templates:
      - ../templates/app/metrics.yaml
    values:
      - ../values/minikube/values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "existing: golang"
    templates:
      - ../templates/app/metrics.yaml
    values:
      - ../values/values.existing.yaml
    asserts:
      - matchSnapshot: {}
  - it: "metadata: golang"
    templates:
      - ../templates/app/metrics.yaml
    values:
      - ./files/values.metadata.yaml
    asserts:
      - matchSnapshot: {}
  - it: "disabled: golang"
    templates:
      - ../templates/app/metrics.yaml
    values:
      - ./files/values.disabled.yaml
    asserts:
      - matchSnapshot: {}
  - it: "extract: golang"
    templates:
      - ../templates/app/metrics.yaml
    values:
      - ../values/extract/values.yaml
    asserts:
      - matchSnapshot: {}
  - it: "extract.ingest: golang"
    templates:
      - ../templates/app/metrics.yaml
    values:
      - ./files/values.extract.ingest.yaml
    asserts:
      - matchSnapshot: {}
  - it: "extract.oai: golang"
    templates:
      - ../templates/app/metrics.yaml
    values:
      - ../values/extract/values.oai.yaml
    asserts:
      - matchSnapshot: {}
  - it: "cloud: golang"
    templates:
      - ../templates/app/metrics.yaml
    values:
      - ./files/values.cloud.yaml
    asserts:
      - matchSnapshot: {}
  - it: "phoenix: golang"
    templates:
      - ../templates/app/metrics.yaml
    values:
      - ./files/values.phoenix.yaml
    asserts:
      - matchSnapshot: {}
  - it: "workspace-enabled: metrics"
    templates:
      - ../templates/app/metrics.yaml
    values:
      - ./files/values.disabled.yaml
      - ./files/values.workspace.enabled.yaml
    asserts:
      - matchSnapshot: {}
  - it: "chart-created metrics cache (ACL username+password) gets a user-ACL conf Secret mounted and started with it"
    templates:
      - ../templates/resources/cache-metrics-conf.yaml
      - ../templates/services/cache-metrics.yaml
    values:
      - ../values.yaml
    set:
      cache.metrics.username: metrics-acl-user
      cache.metrics.password: "metrics-conf-p@ss"
    asserts:
      - hasDocuments:
          count: 1
        template: ../templates/resources/cache-metrics-conf.yaml
      - equal:
          path: metadata.name
          value: cache-metrics-conf-map
        template: ../templates/resources/cache-metrics-conf.yaml
      - matchRegex:
          path: stringData["redis.conf"]
          pattern: 'include /etc/redis\.conf'
        template: ../templates/resources/cache-metrics-conf.yaml
      - matchRegex:
          path: stringData["redis.conf"]
          pattern: "user default off"
        template: ../templates/resources/cache-metrics-conf.yaml
      - matchRegex:
          path: stringData["redis.conf"]
          pattern: 'user "metrics-acl-user" on ">metrics-conf-p@ss" ~\* &\* \+@all'
        template: ../templates/resources/cache-metrics-conf.yaml
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - redis-server
            - /etc/redis/redis.conf
        template: ../templates/services/cache-metrics.yaml
        documentSelector:
          path: kind
          value: StatefulSet
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: cache-metrics-conf
            mountPath: /etc/redis
            readOnly: true
        template: ../templates/services/cache-metrics.yaml
        documentSelector:
          path: kind
          value: StatefulSet
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cache-metrics-conf
            secret:
              secretName: cache-metrics-conf-map
        template: ../templates/services/cache-metrics.yaml
        documentSelector:
          path: kind
          value: StatefulSet
      - isNotNullOrEmpty:
          path: spec.template.metadata.annotations["config-hash"]
        template: ../templates/services/cache-metrics.yaml
        documentSelector:
          path: kind
          value: StatefulSet
  - it: "default-off: with no credential, chart-created metrics cache renders no conf Secret, no conf mount/args, no config-hash annotation"
    templates:
      - ../templates/resources/cache-metrics-conf.yaml
      - ../templates/services/cache-metrics.yaml
    values:
      - ../values.yaml
    asserts:
      - hasDocuments:
          count: 0
        template: ../templates/resources/cache-metrics-conf.yaml
      - notExists:
          path: spec.template.spec.containers[0].args
        template: ../templates/services/cache-metrics.yaml
        documentSelector:
          path: kind
          value: StatefulSet
      - notExists:
          path: spec.template.metadata.annotations
        template: ../templates/services/cache-metrics.yaml
        documentSelector:
          path: kind
          value: StatefulSet
