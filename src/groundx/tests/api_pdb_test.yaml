suite: "extract api disruption budget renders as expected"
chart:
  appVersion: 0.1.0
  version: 0.1.0

tests:
  - it: "default: no extract api disruption budget"
    templates:
      - ../templates/app/api.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      extract.enabled: true
      extract.api.enabled: true
    asserts:
      - hasDocuments:
          count: 2

  - it: "enabled: extract api disruption budget"
    templates:
      - ../templates/app/api.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      extract.enabled: true
      extract.api.enabled: true
      extract.api.disruptionBudget.enabled: true
    documentSelector:
      path: kind
      value: PodDisruptionBudget
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: metadata.name
          value: extract-api
      - equal:
          path: spec.minAvailable
          value: 1
      - equal:
          path: spec.selector.matchLabels.app
          value: extract-api
