suite: "ranker renders as expected"
chart:
  appVersion: 0.1.0
  version: 0.1.0

tests:
  - it: "ranker inference uses worker-aware HTTP probes"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      ranker.inference.enabled: true
    documentSelector:
      path: metadata.name
      value: ranker-inference
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /alive
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 8080
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.exec
  - it: "ranker inference HPA uses celery queue backpressure with multi-sample scale-up stabilization"
    templates:
      - ../templates/resources/hpa.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      ranker.inference.enabled: true
      ranker.inference.replicas.hpa: true
      ranker.inference.replicas.desired: 1
      ranker.inference.replicas.min: 1
      ranker.inference.replicas.max: 4
      ranker.inference.replicas.target: 0.7
      ranker.inference.replicas.threshold: 10
      ranker.inference.replicas.throughput: 60000
      ranker.inference.replicas.cooldown: 450
    documentSelector:
      path: metadata.name
      value: ranker-inference-hpa
    asserts:
      - equal:
          path: spec.minReplicas
          value: 1
      - equal:
          path: spec.maxReplicas
          value: 4
      - equal:
          path: spec.metrics[0].external.target.value
          value: 0.7
      - equal:
          path: spec.metrics[1].external.target.value
          value: 0.7
      - equal:
          path: spec.metrics[0].external.metric.name
          value: ranker-inference:throughput
      - equal:
          path: spec.metrics[1].external.metric.name
          value: ranker-inference:task
      - equal:
          path: spec.behavior.scaleUp.stabilizationWindowSeconds
          value: 45
      - equal:
          path: spec.behavior.scaleUp.policies[0].periodSeconds
          value: 450
      - equal:
          path: spec.behavior.scaleUp.policies[1].periodSeconds
          value: 450
      - equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 900
  - it: "ranker inference config uses celery task queue metric"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    set:
      ranker.inference.enabled: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?s)task:\\n(?:\\s+.*\\n)*\\s+- name: ranker-inference\\n\\s+session: ranker\\n\\s+target: inference_queue\\n\\s+threshold: 10"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "(?s)inference:\\n(?:\\s+- name: [^\\n]+\\n\\s+tokensPerMinute: [0-9]+\\n)*\\s+- name: ranker-inference\\n\\s+tokensPerMinute:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "rankerSession:"
  - it: "ranker cache override configures ranker metrics task session"
    templates:
      - ../templates/resources/config-yaml.yaml
    values:
      - ../values.yaml
    set:
      ranker.inference.enabled: true
      ranker.cache.addr: ranker-cache.existing.com
      ranker.cache.isCluster: false
      ranker.cache.port: 6380
      ranker.cache.ssl: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?s)rankerSession:\\n\\s+addr: ranker-cache\\.existing\\.com:6380\\n\\s+notCluster: true\\n\\s+ssl: true"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?s)task:\\n(?:\\s+.*\\n)*\\s+- name: ranker-inference\\n\\s+session: ranker\\n\\s+target: inference_queue\\n\\s+threshold: 10"
  - it: "cache override: ranker config"
    templates:
      - ../templates/resources/ranker-config-py.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      ranker.api.enabled: true
      ranker.inference.enabled: true
      ranker.cache.addr: ranker-cache.existing.com
      ranker.cache.port: 6380
      ranker.cache.ssl: true
      ranker.cache.type: valkey
    asserts:
      - matchSnapshot: {}
  - it: "cache override: ranker api"
    templates:
      - ../templates/app/api.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      ranker.api.enabled: true
      ranker.cache.addr: ranker-cache.existing.com
      ranker.cache.port: 6380
      ranker.cache.ssl: true
    asserts:
      - matchSnapshot: {}
  - it: "cache override: ranker inference"
    templates:
      - ../templates/app/inference.yaml
    values:
      - ./files/values.disabled.yaml
    set:
      ranker.inference.enabled: true
      ranker.cache.addr: ranker-cache.existing.com
      ranker.cache.port: 6380
      ranker.cache.ssl: true
    asserts:
      - matchSnapshot: {}
