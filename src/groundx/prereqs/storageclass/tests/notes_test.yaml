suite: "storageclass NOTES.txt warns on an EBS lookup-hit encryption disagreement, and only there"
templates:
  - ../templates/NOTES.txt
kubernetesProvider:
  scheme:
    "storage.k8s.io/v1/StorageClass":
      gvr:
        group: "storage.k8s.io"
        version: "v1"
        resource: "storageclasses"
      namespaced: false
  objects:
    - kind: StorageClass
      apiVersion: storage.k8s.io/v1
      metadata:
        name: existing-ebs-unencrypted
      parameters:
        type: gp3
        encrypted: "false"
    - kind: StorageClass
      apiVersion: storage.k8s.io/v1
      metadata:
        name: existing-ebs-encrypted
      parameters:
        type: gp3
        encrypted: "true"
    - kind: StorageClass
      apiVersion: storage.k8s.io/v1
      metadata:
        name: existing-efs
      parameters:
        provisioningMode: efs-ap
        fileSystemId: fs-0123456789abcdef0
        basePath: /eyelevel

tests:
  - it: "EBS lookup hit, supplied encrypted disagrees with the live class: warns that the supplied value was not applied"
    set:
      storageClassName: existing-ebs-unencrypted
    asserts:
      - matchRegexRaw:
          pattern: "already exists"

  - it: "EBS lookup hit, supplied encrypted agrees with the live class: stays silent"
    set:
      storageClassName: existing-ebs-encrypted
    asserts:
      - notMatchRegexRaw:
          pattern: "already exists"
      - equalRaw:
          value: ""

  - it: "non-EBS lookup hit never warns, even though the supplied and live parameters disagree"
    set:
      storageClassName: existing-efs
      provisioner: efs.csi.aws.com
      parameters.provisioningMode: efs-ap
      parameters.fileSystemId: fs-REPLACE_ME
      parameters.basePath: /eyelevel
    asserts:
      - notMatchRegexRaw:
          pattern: "already exists"
      - equalRaw:
          value: ""
