node: eyelevel-cpu-only
serviceName: stream

cluster:
  # version/metaVersion: leave unset only for a fresh/greenfield install. See README.md
  # "Upgrading an existing 0.1.x install" for the pin/namespace/CRD-API rules that apply
  # when upgrading an existing cluster in place.
  metaVersion: ""
  port: 9092
  # replicas drives the Kafka broker replication-factor config block and must not
  # exceed nodepool.replicas (the actual broker/controller pool size).
  replicas: 1
  version: ""

nodepool:
  replicas: 1
  storage: 5Gi