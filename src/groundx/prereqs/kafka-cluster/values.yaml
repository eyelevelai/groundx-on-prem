node: eyelevel-cpu-only
serviceName: stream

cluster:
  # version/metaVersion: leave unset only for a fresh/greenfield install so Strimzi picks its own
  # supported defaults. An existing cluster upgrading this chart in place must set both to its
  # currently-running Kafka version/metadata version, or the unpinned operator can roll it to a
  # newer default version.
  metaVersion: ""
  port: 9092
  # replicas drives the Kafka broker replication-factor config block and must not
  # exceed nodepool.replicas (the actual broker/controller pool size).
  replicas: 1
  version: ""

nodepool:
  replicas: 1
  storage: 5Gi