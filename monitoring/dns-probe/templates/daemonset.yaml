apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dns-probe
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: dns-probe
  template:
    metadata:
      labels:
        app: dns-probe
      annotations:
        checksum/script: {{ .Files.Get "files/dns_probe.py" | sha256sum }}
    spec:
      serviceAccountName: dns-probe
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node
                    operator: In
                    values: [eyelevel-cpu-only]
              - matchExpressions:
                  - key: eyelevel_node
                    operator: In
                    values: [eyelevel-cpu-only]
      tolerations:
        - key: node
          operator: Equal
          value: eyelevel-cpu-only
          effect: NoSchedule
        - key: eyelevel_node
          operator: Equal
          value: eyelevel-cpu-only
          effect: NoSchedule
      containers:
        - name: probe
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["python", "-u", "/opt/dns-probe/dns_probe.py"]
          env:
            - name: TARGET_HOST
              value: {{ required "targetHost must be the extraction Redis hostname" .Values.targetHost | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: INTERVAL_SECONDS
              value: {{ .Values.intervalSeconds | quote }}
            - name: SUCCESS_LOG_EVERY
              value: {{ .Values.successLogEvery | quote }}
            - name: QUERY_TIMEOUT_SECONDS
              value: {{ .Values.queryTimeoutSeconds | quote }}
            - name: SLOW_THRESHOLD_SECONDS
              value: {{ .Values.slowThresholdSeconds | quote }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: code
              mountPath: /opt/dns-probe
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: dns-probe
