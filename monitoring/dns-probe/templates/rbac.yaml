apiVersion: v1
kind: ServiceAccount
metadata:
  name: dns-probe
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dns-probe
  namespace: kube-system
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dns-probe
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: dns-probe
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: dns-probe
  apiGroup: rbac.authorization.k8s.io
